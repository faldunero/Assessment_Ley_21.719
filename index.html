.meta-base{background:#f5f8ff;border-radius:8px;padding:10px 12px;line-height:1.55;font-size:14px}
.crit-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.crit{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.crit input{margin-top:3px;width:16px;height:16px;flex:0 0 16px}
.crit b{display:block;font-size:14px}
.crit small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.4}
.meta-calc{margin-top:10px;font-size:14px;background:#fbfbfd;border:1px dashed #c5cde0;border-radius:8px;padding:8px 10px}
.meta-act{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-top:12px}
.meta-just{margin-top:10px;font-size:13px;background:#fff8e6;border-radius:8px;padding:8px 10px}

.hist-wrap svg{display:block}

table.matriz{table-layout:fixed}
table.matriz th.mx-h{text-align:center;font-size:12px}
table.matriz th.mx-f{width:150px;font-size:12px;background:#eef2f9;color:var(--navy)}
table.matriz td.mx-c{vertical-align:top;min-height:70px;font-size:12.5px;line-height:1.4;border:2px solid #fff}
.mx-d{margin-bottom:4px}

.hm-scroll{overflow-x:auto}
table.heat{width:100%;min-width:980px;table-layout:fixed;border-collapse:separate;border-spacing:0}
table.heat col.hm-col-r{width:240px}
table.heat col.hm-col-c{width:auto}
table.heat th.hm-corner{background:var(--navy);color:#fff;font-size:12px;text-align:left;padding:8px 10px;position:sticky;left:0;z-index:2}
table.heat th.hm-h{font-size:11.5px;text-align:center;background:#eef2f9;color:var(--navy);padding:8px 4px;line-height:1.25;white-space:normal;word-break:break-word}
table.heat th.hm-r{font-size:12.5px;text-align:left;background:#f5f7fb;color:var(--navy);padding:6px 10px;white-space:normal;line-height:1.3;position:sticky;left:0;z-index:1;border-right:1px solid var(--line)}
table.heat th.hm-r .hm-cod{display:inline-block;min-width:34px;font-weight:700}
table.heat td.hm-c{text-align:center;font-weight:700;font-size:13px;color:#1d2433;border:2px solid #fff;height:38px;padding:0}
.hm-leyenda{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin:6px 0 10px}
.hm-escala{display:inline-block;width:180px;height:12px;border-radius:6px;background:linear-gradient(90deg,rgb(224,102,102),rgb(255,217,102),rgb(106,168,79))}
.hm-detalle{display:flex;flex-direction:column;gap:6px}
.hm-fila{display:flex;align-items:center;gap:10px}
.hm-et{width:44px;font-size:12px;font-weight:700;color:var(--navy);flex:0 0 44px}
.hm-tiles{display:flex;flex-wrap:wrap;gap:3px}
.hm-t{display:inline-block;width:14px;height:14px;border-radius:3px;cursor:default}
.bottom-nav{display:none}
.mas-lista{display:flex;flex-direction:column;gap:8px}
.mas-op{text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;cursor:pointer;font:inherit}
.mas-op b{color:var(--navy);font-size:15px}
.mas-op span{font-size:13px}
@media (max-width:760px){
  nav#nav{display:none}
  .bottom-nav{display:flex;position:fixed;inset:auto 0 0 0;width:100%;box-sizing:border-box;margin:0;top:auto;height:auto;align-self:auto;overflow:visible;max-width:none;background:#0d1a2f;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));gap:4px;justify-content:space-around;z-index:45;box-shadow:0 -4px 14px rgba(0,0,0,.18)}
  .bottom-nav button{background:none;color:#c9d3e6;border:0;font:inherit;font-size:11px;padding:7px 2px;flex:1 1 0;min-width:0;border-radius:8px;cursor:pointer;min-height:44px;white-space:normal;line-height:1.2}
  .bottom-nav button.on{color:#fff;background:#1F3864}
  html,body{overflow-x:hidden;max-width:100%}
  body{display:block;min-height:0}
  .wrap{display:block;width:100%}
  main{padding:10px 10px 90px;width:100%;max-width:100%;box-sizing:border-box}
  .toolbar{display:none}
  .grid2,.grid3,.res-kpis,.grid-det{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .filtros{flex-direction:column;align-items:stretch}
  .filtros select,.filtros input{min-width:0;width:100%}
  .ov{padding:8px}
  .av-card,.mdl{width:100%;max-height:96vh}
  .av-head{padding:14px}
  .av-body{padding:12px 14px}
  .av-foot{padding:12px 14px}
  h2{font-size:18px}
  .sem-circ{width:48px;height:48px;flex-basis:48px}
  .sem-t{font-size:17px}
}

ilidades de SI. Qué debe levantar: Están definidos y documentados quién hace qué en seguridad (matriz de responsabilidades).", "tema": "5. Controles Organizacionales"}, {"marco": "ISO 27001:2022", "id": "5.3", "descripcion": "Segregación de funciones. Qué debe levantar: Las funciones incompatibles (por ejemplo, crear y aprobar pagos) están separadas o tienen control compensatorio.", "tema": "5. Controles Organizacionales"}, {"marco": "ISO 27001:2022", "id": "5.4", "descripcion": "Responsabilidades de la dirección. Qué debe levantar: La dirección revisa y respalda la seguridad: actas, compromisos y recursos asignados.", "tema": "5. Controles Organizacionales"}, {"marco": "ISO 27001:2022", "id": "5.5", "descripcion": "Contacto con autoridades. Qué debe levantar: Existen contactos definidos con autoridades (Agencia de Protección de Datos, CPLT, ANCI, policía) y canales conocidos.", "tema": "5. Controles Organizacionales"}, {"marco": "ISO 27001:2022", "id": "5.6", "descripcion": "Contacto con grupos de interés especial. Qué debe levantar: La organización participa en foros o CERT que entregan información de seguridad.", "tema": "5. Controles Organizacionales"}, {"marco": "ISO 27001:2022", "id": "5.7", "descripcion": "Inteligencia de amenazas. Qué debe levantar: Se recibe y analiza información sobre amenazas que pueden afectar a la organización.", "tema": "5. Controles Organizacionales"}, {"marco": "ISO 27001:2022", "id": "5.8", "descripcion": "SI en gestión de proyectos. Qué debe levantar: Los proyectos incluyen revisión de seguridad y privacidad desde su inicio.", "tema": "5. Controles Organizacionales"}, {"marco": "ISO 27001:2022", "id": "5.9", "descripcion": "Inventario de información y activos. Qué debe levantar: Existe un inventario de activos de información con dueño, clasificación y ubicación.", "tema": "5. Controles Organizacionales"}, {"marco": "ISO 27001:2022", "id": "5.10", "descripcion": "Uso aceptable de información. Qué debe levantar: Existe una política de uso aceptable de la información, firmada por los usuarios.", "tema": "5. Controles Organizacionales"}, {"marco": "ISO 27001:2022", "id": "5.11", "descripcion": "Devolución de activos. Qué debe levantar: Al salir o cambiar de cargo, el personal devuelve equipos e información, con registro.", "tema": "5. Controles Organizacionales"}, {"marco": "ISO 27001:2022", "id": "5.12", "descripcion": "Clasificación de la información. Qué debe levantar: La información se clasifica por nivel de sensibilidad y la clasificación se aplica en la práctica.", "tema": "5. Controles Organizacionales"}, {"marco": "ISO 27001:2022", "id": "5.13", "descripcion": "Etiquetado de la información. Qué debe levantar: La clasificación se marca en documentos y sistemas según la política.", "tema": "5. Controles Organizacionales"}, {"marco": "ISO 27001:2022", "id": "5.14", "descripcion": "Transferencia de información. Qué debe levantar: Los intercambios con terceros usan canales seguros y acuerdos de confidencialidad.", "tema": "5. Controles Organizacionales"}, {"marco": "ISO 27001:2022", "id": "5.15", "descripcion": "Control de acceso. Qué debe levantar: Existe una política de control de acceso basada en necesidad, aplicada en los sistemas.", "tema": "5. Controles Organizacionales"}, {"marco": "ISO 27001:2022", "id": "5.16", "descripcion": "Gestión de identidades. Qué debe levantar: El alta, cambio y baja de usuarios están controlados y con evidencia.", "tema": "5. Controles Organizacionales"}, {"marco": "ISO 27001:2022", "id": "5.17", "descripcion": "Información de autenticación. Qué debe levantar: Las contraseñas y credenciales se gestionan con reglas formales (longitud, renovación, almacenamiento).", "tema": "5. Controles Organizacionales"}, {"marco": "ISO 27001:2022", "id": "5.18", "descripcion": "Derechos de acceso. Qué debe levantar: Los permisos se revisan periódicamente y se ajustan al cargo.", "tema": "5. Controles Organizacionales"}, {"marco": "ISO 27001:2022", "id": "5.19", "descripcion": "Seguridad en relaciones con proveedores. Qué debe levantar: Existe un proceso para evaluar la seguridad de los proveedores antes y durante la relación.", "tema": "5. Controles Organizacionales"}, {"marco": "ISO 27001:2022", "id": "5.20", "descripcion": "Seguridad en contratos con proveedores. Qué debe levantar: Los contratos con proveedores incluyen requisitos de seguridad, confidencialidad, auditoría y devolución de datos.", "tema": "5. Controles Organizacionales"}, {"marco": "ISO 27001:2022", "id": "5.21", "descripcion": "Gestión de seguridad en cadena TIC. Qué debe levantar: Se identifican y evalúan los proveedores TIC críticos y sus subcontratistas.", "tema": "5. Controles Organizacionales"}, {"marco": "ISO 27001:2022", "id": "5.22", "descripcion": "Monitoreo de proveedores. Qué debe levantar: Se revisa el desempeño y el cumplimiento de seguridad de los proveedores.", "tema": "5. Controles Organizacionales"}, {"marco": "ISO 27001:2022", "id": "5.23", "descripcion": "SI en servicios en la nube. Qué debe levantar: Los servicios en nube tienen responsabilidades definidas y su configuración se revisa.", "tema": "5. Controles Organizacionales"}, {"marco": "ISO 27001:2022", "id": "5.24", "descripcion": "Planificación y preparación de gestión de incidentes. Qué debe levantar: Existe un plan de respuesta a incidentes con roles, contactos y canales de reporte.", "tema": "5. Controles Organizacionales"}, {"marco": "ISO 27001:2022", "id": "5.25", "descripcion": "Evaluación y decisión sobre eventos de SI. Qué debe levantar: Los eventos de seguridad se evalúan para decidir si son incidentes.", "tema": "5. Controles Organizacionales"}, {"marco": "ISO 27001:2022", "id": "5.26", "descripcion": "Respuesta a incidentes de SI. Qué debe levantar: Los incidentes se atienden según procedimiento, con registro y notificaciones.", "tema": "5. Controles Organizacionales"}, {"marco": "ISO 27001:2022", "id": "5.27", "descripcion": "Aprendizaje de los incidentes. Qué debe levantar: Después de cada incidente se documentan las causas y las mejoras.", "tema": "5. Controles Organizacionales"}, {"marco": "ISO 27001:2022", "id": "5.28", "descripcion": "Recolección de evidencia. Qué debe levantar: Se conserva evidencia de los incidentes de forma íntegra para investigaciones.", "tema": "5. Controles Organizacionales"}, {"marco": "ISO 27001:2022", "id": "5.29", "descripcion": "Seguridad de la información durante disrupción. Qué debe levantar: Existen medidas de seguridad activas durante una interrupción operativa.", "tema": "5. Controles Organizacionales"}, {"marco": "ISO 27001:2022", "id": "5.30", "descripcion": "Preparación TIC para continuidad. Qué debe levantar: Los sistemas críticos tienen plan de recuperación probado, con RTO y RPO definidos.", "tema": "5. Controles Organizacionales"}, {"marco": "ISO 27001:2022", "id": "5.31", "descripcion": "Requisitos legales, estatutarios y contractuales. Qué debe levantar: Se identifican y actualizan las obligaciones legales (incluida la Ley 21.719) y quién es responsable.", "tema": "5. Controles Organizacionales"}, {"marco": "ISO 27001:2022", "id": "5.32", "descripcion": "Derechos de propiedad intelectual. Qué debe levantar: Existe control de licencias de software y de propiedad intelectual.", "tema": "5. Controles Organizacionales"}, {"marco": "ISO 27001:2022", "id": "5.33", "descripcion": "Protección de registros. Qué debe levantar: Los registros (contratos, logs, expedientes) están protegidos y tienen plazo de retención.", "tema": "5. Controles Organizacionales"}, {"marco": "ISO 27001:2022", "id": "5.34", "descripcion": "Privacidad y protección de datos personales. Qué debe levantar: Existe un programa de privacidad: bases legales, avisos, derechos de los titulares y registro de tratamientos.", "tema": "5. Controles Organizacionales"}, {"marco": "ISO 27001:2022", "id": "5.35", "descripcion": "Revisión independiente de SI. Qué debe levantar: La seguridad es revisada por auditoría interna o externa.", "tema": "5. Controles Organizacionales"}, {"marco": "ISO 27001:2022", "id": "5.36", "descripcion": "Cumplimiento con políticas y normas de SI. Qué debe levantar: Se verifica periódicamente que las políticas se cumplen.", "tema": "5. Controles Organizacionales"}, {"marco": "ISO 27001:2022", "id": "5.37", "descripcion": "Procedimientos de operación documentados. Qué debe levantar: Los procedimientos operativos están documentados y accesibles para quien los necesita.", "tema": "5. Controles Organizacionales"}, {"marco": "ISO 27001:2022", "id": "6.1", "descripcion": "Selección de personal. Qué debe levantar: Se verifican antecedentes del personal antes de contratar, respetando la ley.", "tema": "6. Controles de Personas"}, {"marco": "ISO 27001:2022", "id": "6.2", "descripcion": "Términos y condiciones de empleo. Qué debe levantar: Los contratos de trabajo incluyen responsabilidades de seguridad y privacidad.", "tema": "6. Controles de Personas"}, {"marco": "ISO 27001:2022", "id": "6.3", "descripcion": "Concientización, educación y capacitación en SI. Qué debe levantar: El personal recibe capacitación en seguridad y privacidad, con registro de asistencia.", "tema": "6. Controles de Personas"}, {"marco": "ISO 27001:2022", "id": "6.4", "descripcion": "Proceso disciplinario. Qué debe levantar: Existe un proceso formal de sanciones por incumplimiento de políticas.", "tema": "6. Controles de Personas"}, {"marco": "ISO 27001:2022", "id": "6.5", "descripcion": "Responsabilidades ante terminación o cambio de empleo. Qué debe levantar: Al término o cambio de cargo se revocan accesos y se recuperan activos.", "tema": "6. Controles de Personas"}, {"marco": "ISO 27001:2022", "id": "6.6", "descripcion": "Acuerdos de confidencialidad. Qué debe levantar: Existen acuerdos de confidencialidad firmados por el personal y terceros.", "tema": "6. Controles de Personas"}, {"marco": "ISO 27001:2022", "id": "6.7", "descripcion": "Trabajo remoto. Qué debe levantar: El trabajo remoto tiene reglas sobre equipos, redes y lugares de trabajo.", "tema": "6. Controles de Personas"}, {"marco": "ISO 27001:2022", "id": "6.8", "descripcion": "Reporte de eventos de SI. Qué debe levantar: El personal sabe cómo y dónde reportar un evento sospechoso.", "tema": "6. Controles de Personas"}, {"marco": "ISO 27001:2022", "id": "7.1", "descripcion": "Perímetros de seguridad física. Qué debe levantar: Las áreas sensibles están delimitadas con barreras físicas.", "tema": "7. Controles Físicos"}, {"marco": "ISO 27001:2022", "id": "7.2", "descripcion": "Controles de entrada física. Qué debe levantar: El ingreso a áreas seguras está controlado y registrado.", "tema": "7. Controles Físicos"}, {"marco": "ISO 27001:2022", "id": "7.3", "descripcion": "Seguridad de oficinas, recintos e instalaciones. Qué debe levantar: Oficinas, bodegas y recintos tienen protección física acorde a su sensibilidad.", "tema": "7. Controles Físicos"}, {"marco": "ISO 27001:2022", "id": "7.4", "descripcion": "Monitoreo de seguridad física. Qué debe levantar: Existe vigilancia (CCTV, alarmas) con plazo de retención definido.", "tema": "7. Controles Físicos"}, {"marco": "ISO 27001:2022", "id": "7.5", "descripcion": "Protección contra amenazas físicas y ambientales. Qué debe levantar: Existe protección contra incendio, inundación, temperatura y otras amenazas ambientales.", "tema": "7. Controles Físicos"}, {"marco": "ISO 27001:2022", "id": "7.6", "descripcion": "Trabajo en áreas seguras. Qué debe levantar: Existen reglas para trabajar en áreas seguras.", "tema": "7. Controles Físicos"}, {"marco": "ISO 27001:2022", "id": "7.7", "descripcion": "Escritorio limpio y pantalla limpia. Qué debe levantar: Documentos y pantallas quedan protegidos cuando el personal se ausenta.", "tema": "7. Controles Físicos"}, {"marco": "ISO 27001:2022", "id": "7.8", "descripcion": "Ubicación y protección de equipos. Qué debe levantar: Los equipos están ubicados para evitar acceso o daño no autorizado.", "tema": "7. Controles Físicos"}, {"marco": "ISO 27001:2022", "id": "7.9", "descripcion": "Seguridad de activos fuera de las instalaciones. Qué debe levantar: Los equipos y datos fuera de la oficina tienen protección (cifrado, control de salida).", "tema": "7. Controles Físicos"}, {"marco": "ISO 27001:2022", "id": "7.10", "descripcion": "Medios de almacenamiento. Qué debe levantar: Los medios removibles (USB, discos) están controlados y cifrados.", "tema": "7. Controles Físicos"}, {"marco": "ISO 27001:2022", "id": "7.11", "descripcion": "Servicios de suministro. Qué debe levantar: Energía, agua y comunicaciones están protegidas (UPS, respaldos).", "tema": "7. Controles Físicos"}, {"marco": "ISO 27001:2022", "id": "7.12", "descripcion": "Seguridad del cableado. Qué debe levantar: El cableado está protegido contra daño o interceptación.", "tema": "7. Controles Físicos"}, {"marco": "ISO 27001:2022", "id": "7.13", "descripcion": "Mantenimiento de equipos. Qué debe levantar: Los mantenimientos están programados y registrados.", "tema": "7. Controles Físicos"}, {"marco": "ISO 27001:2022", "id": "7.14", "descripcion": "Eliminación o reutilización segura de equipos. Qué debe levantar: Los equipos y medios se borran o destruyen de forma segura y con certificado.", "tema": "7. Controles Físicos"}, {"marco": "ISO 27001:2022", "id": "8.1", "descripcion": "Dispositivos de usuario final. Qué debe levantar: Los equipos de usuario tienen configuración, cifrado y protección mínima definida.", "tema": "8. Controles Tecnológicos"}, {"marco": "ISO 27001:2022", "id": "8.2", "descripcion": "Derechos de acceso privilegiado. Qué debe levantar: Las cuentas administrativas están controladas, con registro y revisión.", "tema": "8. Controles Tecnológicos"}, {"marco": "ISO 27001:2022", "id": "8.3", "descripcion": "Restricción de acceso a la información. Qué debe levantar: El acceso a la información se limita según el rol.", "tema": "8. Controles Tecnológicos"}, {"marco": "ISO 27001:2022", "id": "8.4", "descripcion": "Acceso al código fuente. Qué debe levantar: El código fuente tiene acceso restringido y control de versiones.", "tema": "8. Controles Tecnológicos"}, {"marco": "ISO 27001:2022", "id": "8.5", "descripcion": "Autenticación segura. Qué debe levantar: Los sistemas con datos personales exigen autenticación robusta (MFA y contraseñas seguras).", "tema": "8. Controles Tecnológicos"}, {"marco": "ISO 27001:2022", "id": "8.6", "descripcion": "Gestión de capacidad. Qué debe levantar: La capacidad de servidores y servicios se monitorea.", "tema": "8. Controles Tecnológicos"}, {"marco": "ISO 27001:2022", "id": "8.7", "descripcion": "Protección contra malware. Qué debe levantar: Existe antivirus o EDR activo y actualizado en todos los equipos.", "tema": "8. Controles Tecnológicos"}, {"marco": "ISO 27001:2022", "id": "8.8", "descripcion": "Gestión de vulnerabilidades técnicas. Qué debe levantar: Existen escaneos de vulnerabilidades y parches con plazos definidos.", "tema": "8. Controles Tecnológicos"}, {"marco": "ISO 27001:2022", "id": "8.9", "descripcion": "Gestión de la configuración. Qué debe levantar: Existen configuraciones base (hardening) definidas y controladas.", "tema": "8. Controles Tecnológicos"}, {"marco": "ISO 27001:2022", "id": "8.10", "descripcion": "Eliminación de información. Qué debe levantar: Los datos se eliminan al cumplir su plazo, con evidencia de la eliminación.", "tema": "8. Controles Tecnológicos"}, {"marco": "ISO 27001:2022", "id": "8.11", "descripcion": "Enmascaramiento de datos. Qué debe levantar: Los datos personales se enmascaran en pruebas, reportes o entornos no productivos.", "tema": "8. Controles Tecnológicos"}, {"marco": "ISO 27001:2022", "id": "8.12", "descripcion": "Prevención de fuga de datos. Qué debe levantar: Existen controles para evitar envíos o copias no autorizadas de datos.", "tema": "8. Controles Tecnológicos"}, {"marco": "ISO 27001:2022", "id": "8.13", "descripcion": "Respaldo de información. Qué debe levantar: Existen respaldos periódicos, cifrados y con prueba de restauración.", "tema": "8. Controles Tecnológicos"}, {"marco": "ISO 27001:2022", "id": "8.14", "descripcion": "Redundancia de instalaciones de procesamiento. Qué debe levantar: Los sistemas críticos tienen redundancia de infraestructura.", "tema": "8. Controles Tecnológicos"}, {"marco": "ISO 27001:2022", "id": "8.15", "descripcion": "Registro de actividades (logging). Qué debe levantar: Se registran accesos y acciones sobre datos, con logs protegidos y retención definida.", "tema": "8. Controles Tecnológicos"}, {"marco": "ISO 27001:2022", "id": "8.16", "descripcion": "Actividades de monitoreo. Qué debe levantar: Existen alertas y revisión periódica de logs.", "tema": "8. Controles Tecnológicos"}, {"marco": "ISO 27001:2022", "id": "8.17", "descripcion": "Sincronización de relojes. Qué debe levantar: Los relojes de los sistemas están sincronizados.", "tema": "8. Controles Tecnológicos"}, {"marco": "ISO 27001:2022", "id": "8.18", "descripcion": "Uso de programas de utilidad con privilegios. Qué debe levantar: Las herramientas de administración con privilegios están restringidas.", "tema": "8. Controles Tecnológicos"}, {"marco": "ISO 27001:2022", "id": "8.19", "descripcion": "Instalación de software en sistemas operativos. Qué debe levantar: Solo se instala software autorizado.", "tema": "8. Controles Tecnológicos"}, {"marco": "ISO 27001:2022", "id": "8.20", "descripcion": "Seguridad en redes. Qué debe levantar: Las redes están protegidas con firewalls y reglas definidas.", "tema": "8. Controles Tecnológicos"}, {"marco": "ISO 27001:2022", "id": "8.21", "descripcion": "Seguridad de los servicios de red. Qué debe levantar: Los servicios de red (VPN, DNS, otros) están asegurados y acordados.", "tema": "8. Controles Tecnológicos"}, {"marco": "ISO 27001:2022", "id": "8.22", "descripcion": "Segregación de redes. Qué debe levantar: Las redes están separadas según sensibilidad de la información.", "tema": "8. Controles Tecnológicos"}, {"marco": "ISO 27001:2022", "id": "8.23", "descripcion": "Filtrado web. Qué debe levantar: La navegación está filtrada contra sitios riesgosos.", "tema": "8. Controles Tecnológicos"}, {"marco": "ISO 27001:2022", "id": "8.24", "descripcion": "Uso de criptografía. Qué debe levantar: El cifrado usa estándares definidos, en tránsito y en reposo.", "tema": "8. Controles Tecnológicos"}, {"marco": "ISO 27001:2022", "id": "8.25", "descripcion": "Ciclo de vida de desarrollo seguro. Qué debe levantar: El ciclo de desarrollo integra seguridad desde el diseño.", "tema": "8. Controles Tecnológicos"}, {"marco": "ISO 27001:2022", "id": "8.26", "descripcion": "Requisitos de seguridad en aplicaciones. Qué debe levantar: Los requisitos de seguridad se definen antes de desarrollar o comprar una aplicación.", "tema": "8. Controles Tecnológicos"}, {"marco": "ISO 27001:2022", "id": "8.27", "descripcion": "Principios de arquitectura segura. Qué debe levantar: Se aplican principios de arquitectura segura.", "tema": "8. Controles Tecnológicos"}, {"marco": "ISO 27001:2022", "id": "8.28", "descripcion": "Codificación segura. Qué debe levantar: El código se escribe y revisa con prácticas de codificación segura.", "tema": "8. Controles Tecnológicos"}, {"marco": "ISO 27001:2022", "id": "8.29", "descripcion": "Pruebas de seguridad en desarrollo y aceptación. Qué debe levantar: Existen pruebas de seguridad antes de pasar a producción.", "tema": "8. Controles Tecnológicos"}, {"marco": "ISO 27001:2022", "id": "8.30", "descripcion": "Desarrollo externalizado. Qué debe levantar: Los proveedores de desarrollo cumplen requisitos de seguridad.", "tema": "8. Controles Tecnológicos"}, {"marco": "ISO 27001:2022", "id": "8.31", "descripcion": "Separación de entornos. Qué debe levantar: Los entornos de desarrollo, prueba y producción están separados.", "tema": "8. Controles Tecnológicos"}, {"marco": "ISO 27001:2022", "id": "8.32", "descripcion": "Gestión de cambios. Qué debe levantar: Los cambios se aprueban y registran antes de implementarse.", "tema": "8. Controles Tecnológicos"}, {"marco": "ISO 27001:2022", "id": "8.33", "descripcion": "Información de prueba. Qué debe levantar: Los datos de prueba no contienen datos personales reales sin protección.", "tema": "8. Controles Tecnológicos"}, {"marco": "ISO 27001:2022", "id": "8.34", "descripcion": "Protección de sistemas de información en auditoría. Qué debe levantar: Las auditorías se planifican para no afectar la operación.", "tema": "8. Controles Tecnológicos"}, {"marco": "NIST CSF 2.0", "id": "NIST GV.OC-01", "descripcion": "Misión y contexto de la organización. Qué debe levantar: Verificar que la misión y los objetivos del negocio se conocen y se usan para decidir el nivel de riesgo de privacidad y seguridad.", "tema": "Gobernar (GOVERN)"}, {"marco": "NIST CSF 2.0", "id": "NIST GV.OC-02", "descripcion": "Partes interesadas y sus expectativas. Qué debe levantar: Verificar que están identificados clientes, empleados, reguladores y proveedores, y qué esperan de la organización en privacidad y seguridad.", "tema": "Gobernar (GOVERN)"}, {"marco": "NIST CSF 2.0", "id": "NIST GV.OC-03", "descripcion": "Obligaciones legales, regulatorias y contractuales. Qué debe levantar: Verificar que existe una lista de leyes y contratos aplicables (incluida la Ley 21.719) y que alguien es responsable de mantenerla.", "tema": "Gobernar (GOVERN)"}, {"marco": "NIST CSF 2.0", "id": "NIST GV.OC-04", "descripcion": "Expectativas de partes externas sobre la organización. Qué debe levantar: Verificar que los compromisos con clientes y terceros (por ejemplo, de seguridad de pagos) están documentados y comunicados.", "tema": "Gobernar (GOVERN)"}, {"marco": "NIST CSF 2.0", "id": "NIST GV.OC-05", "descripcion": "Dependencias y servicios críticos de la organización. Qué debe levantar: Verificar que se conocen los servicios de los que depende la organización (nube, pagos, logística) y su criticidad.", "tema": "Gobernar (GOVERN)"}, {"marco": "NIST CSF 2.0", "id": "NIST GV.RR-01", "descripcion": "Liderazgo responsable del riesgo de ciberseguridad. Qué debe levantar: Verificar que la dirección asume la responsabilidad del riesgo de seguridad y privacidad (actas, reportes a directorio).", "tema": "Gobernar (GOVERN)"}, {"marco": "NIST CSF 2.0", "id": "NIST GV.RR-02", "descripcion": "Roles, responsabilidades y autoridades definidos. Qué debe levantar: Verificar que los roles de seguridad y privacidad están definidos, comunicados y que sus responsables saben qué deben hacer.", "tema": "Gobernar (GOVERN)"}, {"marco": "NIST CSF 2.0", "id": "NIST GV.RR-03", "descripcion": "Recursos asignados a la ciberseguridad. Qué debe levantar: Verificar que el presupuesto y el personal para seguridad y privacidad son suficientes para el alcance real.", "tema": "Gobernar (GOVERN)"}, {"marco": "NIST CSF 2.0", "id": "NIST GV.RR-04", "descripcion": "Ciberseguridad incluida en RRHH. Qué debe levantar: Verificar que la contratación, la evaluación y la salida de personal incluyen requisitos de seguridad y privacidad.", "tema": "Gobernar (GOVERN)"}, {"marco": "NIST CSF 2.0", "id": "NIST GV.PO-01", "descripcion": "Política de gestión del riesgo establecida. Qué debe levantar: Verificar que existe una política de gestión de riesgo de ciberseguridad aprobada, difundida y que se aplica.", "tema": "Gobernar (GOVERN)"}, {"marco": "NIST CSF 2.0", "id": "NIST GV.PO-02", "descripcion": "Política revisada y actualizada. Qué debe levantar: Verificar la fecha de la última revisión de la política y que considera cambios legales y tecnológicos recientes.", "tema": "Gobernar (GOVERN)"}, {"marco": "NIST CSF 2.0", "id": "NIST ID.AM-01", "descripcion": "Inventario de hardware. Qué debe levantar: Verificar que existe un listado de equipos (servidores, PC, POS, impresoras) con responsable y ubicación.", "tema": "Identificar (IDENTIFY)"}, {"marco": "NIST CSF 2.0", "id": "NIST ID.AM-02", "descripcion": "Inventario de software y servicios. Qué debe levantar: Verificar que existe un listado de software y servicios en uso, incluidos los de nube y los no autorizados.", "tema": "Identificar (IDENTIFY)"}, {"marco": "NIST CSF 2.0", "id": "NIST ID.AM-03", "descripcion": "Mapa de flujos de datos y comunicaciones. Qué debe levantar: Verificar que hay un diagrama de flujos de datos personales dentro de la organización y hacia terceros.", "tema": "Identificar (IDENTIFY)"}, {"marco": "NIST CSF 2.0", "id": "NIST ID.AM-05", "descripcion": "Priorización de activos por criticidad. Qué debe levantar: Verificar que los activos se priorizan (crítico, alto, medio, bajo) y que la prioridad guía los controles.", "tema": "Identificar (IDENTIFY)"}, {"marco": "NIST CSF 2.0", "id": "NIST ID.AM-08", "descripcion": "Gestión de activos a lo largo de su ciclo de vida. Qué debe levantar: Verificar que los sistemas se gestionan desde su compra hasta su baja, con responsables en cada etapa.", "tema": "Identificar (IDENTIFY)"}, {"marco": "NIST CSF 2.0", "id": "NIST ID.RA-01", "descripcion": "Identificación de vulnerabilidades. Qué debe levantar: Verificar que se realizan escaneos de vulnerabilidades periódicos y que los hallazgos se registran y validan.", "tema": "Identificar (IDENTIFY)"}, {"marco": "NIST CSF 2.0", "id": "NIST ID.RA-08", "descripcion": "Recepción de divulgaciones de vulnerabilidades. Qué debe levantar: Verificar que existe un canal público o interno para que terceros reporten vulnerabilidades y un proceso para responderlas.", "tema": "Identificar (IDENTIFY)"}, {"marco": "NIST CSF 2.0", "id": "NIST PR.AA-01", "descripcion": "Gestión de identidades y credenciales. Qué debe levantar: Verificar que el alta, cambio y baja de usuarios, servicios y equipos se hacen con procedimiento y registro.", "tema": "Proteger (PROTECT)"}, {"marco": "NIST CSF 2.0", "id": "NIST PR.AA-02", "descripcion": "Verificación de identidades. Qué debe levantar: Verificar que la identidad de cada usuario se confirma antes de entregar acceso (por ejemplo, con cédula o contrato).", "tema": "Proteger (PROTECT)"}, {"marco": "NIST CSF 2.0", "id": "NIST PR.AA-03", "descripcion": "Autenticación de usuarios, servicios y equipos. Qué debe levantar: Verificar que todos los accesos exigen autenticación y que las cuentas de servicio también tienen control.", "tema": "Proteger (PROTECT)"}, {"marco": "NIST CSF 2.0", "id": "NIST PR.AA-04", "descripcion": "Protección de aserciones de identidad. Qué debe levantar: Verificar que las sesiones y tokens de autenticación se transmiten y almacenan de forma protegida (cifrados, con expiración).", "tema": "Proteger (PROTECT)"}, {"marco": "NIST CSF 2.0", "id": "NIST PR.AA-05", "descripcion": "Permisos con mínimo privilegio y separación de funciones. Qué debe levantar: Verificar que los permisos se asignan por rol, se revisan periódicamente y no se acumulan sin control.", "tema": "Proteger (PROTECT)"}, {"marco": "NIST CSF 2.0", "id": "NIST PR.DS-11", "descripcion": "Respaldos de datos. Qué debe levantar: Verificar que existen respaldos periódicos, cifrados, almacenados fuera del sistema principal y con prueba de restauración.", "tema": "Proteger (PROTECT)"}, {"marco": "NIST CSF 2.0", "id": "NIST PR.PS-01", "descripcion": "Gestión de configuración segura. Qué debe levantar: Verificar que existen configuraciones base (hardening) para servidores, PC y bases de datos, y que se aplican.", "tema": "Proteger (PROTECT)"}, {"marco": "NIST CSF 2.0", "id": "NIST PR.PS-02", "descripcion": "Software mantenido o retirado según riesgo. Qué debe levantar: Verificar que el software tiene soporte del fabricante y que el software sin soporte se retira o aísla.", "tema": "Proteger (PROTECT)"}, {"marco": "NIST CSF 2.0", "id": "NIST PR.PS-03", "descripcion": "Hardware mantenido o retirado según riesgo. Qué debe levantar: Verificar que los equipos sin soporte o con falla se reemplazan según plan y que el retiro es seguro.", "tema": "Proteger (PROTECT)"}, {"marco": "NIST CSF 2.0", "id": "NIST PR.PS-05", "descripcion": "Prevención de software no autorizado. Qué debe levantar: Verificar que los usuarios no pueden instalar software sin autorización y que existe un listado de software permitido.", "tema": "Proteger (PROTECT)"}, {"marco": "NIST CSF 2.0", "id": "NIST RS.MA-01", "descripcion": "Plan de respuesta ejecutado con terceros. Qué debe levantar: Verificar que el plan de respuesta incluye a proveedores clave (hosting, pagos, SOC) y sus contactos.", "tema": "Responder (RESPOND)"}, {"marco": "NIST CSF 2.0", "id": "NIST RS.MA-02", "descripcion": "Reportes de incidentes clasificados y validados. Qué debe levantar: Verificar que cada reporte de incidente se clasifica y se confirma antes de actuar.", "tema": "Responder (RESPOND)"}, {"marco": "NIST CSF 2.0", "id": "NIST RS.MA-03", "descripcion": "Incidentes categorizados y priorizados. Qué debe levantar: Verificar que los incidentes tienen categoría y prioridad según criterios escritos.", "tema": "Responder (RESPOND)"}, {"marco": "NIST CSF 2.0", "id": "NIST RS.MA-04", "descripcion": "Escalamiento de incidentes. Qué debe levantar: Verificar que existen reglas claras de cuándo escalar un incidente a gerencia, legal o al responsable de privacidad.", "tema": "Responder (RESPOND)"}, {"marco": "NIST CSF 2.0", "id": "NIST RS.MA-05", "descripcion": "Criterios para iniciar la recuperación. Qué debe levantar: Verificar que hay criterios escritos para decidir cuándo se da por terminada la contención y se inicia la recuperación.", "tema": "Responder (RESPOND)"}, {"marco": "NIST CSF 2.0", "id": "NIST RS.AN-03", "descripcion": "Análisis de causa raíz. Qué debe levantar: Verificar que los incidentes importantes tienen un informe de causa raíz con fecha y responsable.", "tema": "Responder (RESPOND)"}, {"marco": "NIST CSF 2.0", "id": "NIST RS.AN-06", "descripcion": "Registro de acciones durante la investigación. Qué debe levantar: Verificar que las acciones durante un incidente quedan registradas (quién, qué, cuándo) sin posibilidad de alteración.", "tema": "Responder (RESPOND)"}, {"marco": "NIST CSF 2.0", "id": "NIST RS.AN-07", "descripcion": "Recolección de datos del incidente. Qué debe levantar: Verificar que se conserva la información del incidente (logs, capturas, correos) con cadena de custodia.", "tema": "Responder (RESPOND)"}, {"marco": "NIST CSF 2.0", "id": "NIST RS.AN-08", "descripcion": "Estimación de la magnitud del incidente. Qué debe levantar: Verificar que se estima cuántos datos y personas afectó un incidente y que la estimación se valida.", "tema": "Responder (RESPOND)"}, {"marco": "NIST CSF 2.0", "id": "NIST RS.CO-02", "descripcion": "Notificación a partes interesadas. Qué debe levantar: Verificar que están definidos quiénes deben ser notificados de un incidente (autoridad, titulares, clientes) y cómo.", "tema": "Responder (RESPOND)"}, {"marco": "NIST CSF 2.0", "id": "NIST RS.CO-03", "descripcion": "Información compartida con partes designadas. Qué debe levantar: Verificar que la información compartida durante un incidente se limita a quienes la necesitan.", "tema": "Responder (RESPOND)"}, {"marco": "NIST CSF 2.0", "id": "NIST RS.MI-01", "descripcion": "Contención de incidentes. Qué debe levantar: Verificar que existen pasos para aislar sistemas o cuentas comprometidas en un incidente y que se han probado.", "tema": "Responder (RESPOND)"}, {"marco": "NIST CSF 2.0", "id": "NIST RS.MI-02", "descripcion": "Erradicación de incidentes. Qué debe levantar: Verificar que, tras un incidente, se elimina la causa (malware, cuenta, vulnerabilidad) antes de restablecer el servicio.", "tema": "Responder (RESPOND)"}, {"marco": "NIST CSF 2.0", "id": "NIST RC.RP-03", "descripcion": "Verificación de integridad de respaldos antes de restaurar. Qué debe levantar: Verificar que los respaldos se validan antes de restaurar datos, para no restaurar archivos dañados o infectados.", "tema": "Recuperar (RECOVER)"}, {"marco": "CIS Controls v8.1", "id": "CIS 1", "descripcion": "Inventario de activos empresariales. Qué debe levantar: Verificar que existe un inventario de todos los equipos conectados a la red, actualizado y con responsable.", "tema": "Controles CIS v8.1"}, {"marco": "CIS Controls v8.1", "id": "CIS 2", "descripcion": "Inventario de software. Qué debe levantar: Verificar que existe un inventario de software instalado y que se controla lo que no está autorizado.", "tema": "Controles CIS v8.1"}, {"marco": "CIS Controls v8.1", "id": "CIS 4", "descripcion": "Configuración segura de activos y software. Qué debe levantar: Verificar que los equipos y software tienen configuración segura documentada y revisada.", "tema": "Controles CIS v8.1"}, {"marco": "CIS Controls v8.1", "id": "CIS 5", "descripcion": "Gestión de cuentas. Qué debe levantar: Verificar que las cuentas de usuario, administrador y servicio se inventarian, se revisan y se desactivan cuando no se usan.", "tema": "Controles CIS v8.1"}, {"marco": "CIS Controls v8.1", "id": "CIS 6", "descripcion": "Gestión del control de acceso. Qué debe levantar: Verificar que el acceso a sistemas y datos se otorga según el rol y se revisa periódicamente.", "tema": "Controles CIS v8.1"}, {"marco": "CIS Controls v8.1", "id": "CIS 7", "descripcion": "Gestión continua de vulnerabilidades. Qué debe levantar: Verificar que se escanea la organización periódicamente y que los hallazgos críticos se corrigen en plazo definido.", "tema": "Controles CIS v8.1"}, {"marco": "CIS Controls v8.1", "id": "CIS 9", "descripcion": "Protección de correo y navegador. Qué debe levantar: Verificar que el correo y la navegación tienen filtros contra phishing, malware y sitios maliciosos.", "tema": "Controles CIS v8.1"}, {"marco": "CIS Controls v8.1", "id": "CIS 10", "descripcion": "Defensas contra malware. Qué debe levantar: Verificar que todos los equipos tienen antivirus o EDR activo, actualizado y monitoreado.", "tema": "Controles CIS v8.1"}, {"marco": "CIS Controls v8.1", "id": "CIS 11", "descripcion": "Recuperación de datos. Qué debe levantar: Verificar que existen respaldos periódicos de datos críticos y que se prueba la recuperación.", "tema": "Controles CIS v8.1"}, {"marco": "CIS Controls v8.1", "id": "CIS 17", "descripcion": "Gestión de respuesta a incidentes. Qué debe levantar: Verificar que existe un plan de respuesta a incidentes, roles asignados y ejercicios realizados.", "tema": "Controles CIS v8.1"}, {"marco": "CIS Controls v8.1", "id": "BM-OS", "descripcion": "Benchmark de sistemas operativos. Qué debe levantar: Verificar que los servidores y equipos usan una configuración base de un estándar reconocido (por ejemplo, CIS Benchmark) y que se revisa.", "tema": "Benchmarks CIS"}, {"marco": "CIS Controls v8.1", "id": "BM-CLOUD", "descripcion": "Benchmark de proveedores de nube. Qué debe levantar: Verificar que las cuentas y servicios en la nube (AWS, Azure, Google u otros) están configurados según un estándar y revisados.", "tema": "Benchmarks CIS"}, {"marco": "CIS Controls v8.1", "id": "BM-DB", "descripcion": "Benchmark de bases de datos. Qué debe levantar: Verificar que las bases de datos tienen configuración segura: usuarios, cifrado, auditoría y puertos restringidos.", "tema": "Benchmarks CIS"}, {"marco": "CIS Controls v8.1", "id": "BM-NET", "descripcion": "Benchmark de dispositivos de red. Qué debe levantar: Verificar que firewalls, switches y routers tienen contraseñas, accesos y servicios configurados según un estándar.", "tema": "Benchmarks CIS"}, {"marco": "CIS Controls v8.1", "id": "BM-CONT", "descripcion": "Benchmark de contenedores y orquestación. Qué debe levantar: Verificar que los contenedores y la orquestación (Docker, Kubernetes) usan imágenes y configuraciones seguras. Aplica solo si hay contenedores.", "tema": "Benchmarks CIS"}, {"marco": "CIS Controls v8.1", "id": "BM-APP", "descripcion": "Benchmark de aplicaciones y navegadores. Qué debe levantar: Verificar que las aplicaciones y navegadores corporativos tienen configuración segura y actualizada.", "tema": "Benchmarks CIS"}, {"marco": "CIS Controls v8.1", "id": "BM-M365", "descripcion": "Benchmark de suites de productividad. Qué debe levantar: Verificar que las suites de oficina y correo (Microsoft 365, Google Workspace) tienen MFA, reglas de compartición y auditoría activas.", "tema": "Benchmarks CIS"}, {"marco": "COBIT 5", "id": "BAI06", "descripcion": "Gestión de cambios. Qué debe levantar: Verificar que los cambios a sistemas se solicitan, evalúan (incluido el impacto en datos personales), aprueban y registran.", "tema": "Construir, adquirir e implementar (BAI)"}, {"marco": "COBIT 5", "id": "BAI07", "descripcion": "Aceptación del cambio y de la transición. Qué debe levantar: Verificar que un cambio se prueba y se aprueba formalmente antes de pasar a producción, con evidencia.", "tema": "Construir, adquirir e implementar (BAI)"}, {"marco": "COBIT 5", "id": "BAI09", "descripcion": "Gestión de activos. Qué debe levantar: Verificar que los activos de TI tienen registro, responsable y se dan de baja de forma controlada.", "tema": "Construir, adquirir e implementar (BAI)"}, {"marco": "COBIT 5", "id": "BAI10", "descripcion": "Gestión de la configuración. Qué debe levantar: Verificar que existe un registro de la configuración de sistemas y que se mantiene actualizado.", "tema": "Construir, adquirir e implementar (BAI)"}, {"marco": "PCI DSS v4.0.1", "id": "PCI Req 2", "descripcion": "Configuraciones seguras en todos los componentes. Qué debe levantar: Verificar que los POS, servidores y equipos del entorno de pagos usan configuraciones seguras y sin valores por defecto.", "tema": "Requisitos PCI DSS v4.0.1"}, {"marco": "PCI DSS v4.0.1", "id": "PCI Req 5", "descripcion": "Protección de sistemas contra software malicioso. Qué debe levantar: Verificar que los equipos del entorno de pagos tienen protección contra malware actualizada y monitoreada.", "tema": "Requisitos PCI DSS v4.0.1"}, {"marco": "PCI DSS v4.0.1", "id": "PCI Req 7", "descripcion": "Acceso restringido según necesidad de saber. Qué debe levantar: Verificar que el acceso a datos de pago se limita a quien lo necesita para su trabajo, con revisión periódica.", "tema": "Requisitos PCI DSS v4.0.1"}, {"marco": "PCI DSS v4.0.1", "id": "PCI Req 8", "descripcion": "Identificación de usuarios y autenticación del acceso. Qué debe levantar: Verificar que cada usuario tiene identificación única y que el acceso al entorno de pago exige autenticación fuerte.", "tema": "Requisitos PCI DSS v4.0.1"}, {"marco": "Normativa chilena", "id": "L21.719 Art.14 sexies", "descripcion": "Deber de reportar vulneraciones de seguridad. Qué debe levantar: Verificar que existe un procedimiento para avisar a la autoridad de vulneraciones que afecten datos personales, con plazo definido según el texto oficial.", "tema": "Normativa chilena"}, {"marco": "Normativa chilena", "id": "L21.719 Art.49", "descripcion": "Modelo de prevención de infracciones. Qué debe levantar: Verificar que existe un modelo documentado para prevenir infracciones (políticas, controles, capacitación y monitoreo).", "tema": "Normativa chilena"}, {"marco": "Normativa chilena", "id": "L21.719 Art.50", "descripcion": "Atribuciones del delegado de protección de datos. Qué debe levantar: Verificar que el delegado de protección tiene funciones, autoridad y acceso a la dirección definidos por escrito.", "tema": "Normativa chilena"}, {"marco": "Normativa chilena", "id": "L21.719 Programa adecuación", "descripcion": "Programa de adecuación de la organización. Qué debe levantar: Verificar que existe un plan de adecuación con responsables, fechas y avance a la fecha.", "tema": "Normativa chilena"}, {"marco": "Normativa chilena", "id": "L21.459 Art.14", "descripcion": "Preservación y custodia de evidencia electrónica. Qué debe levantar: Verificar que la evidencia electrónica de incidentes se conserva íntegra y con custodia.", "tema": "Normativa chilena"}, {"marco": "Normativa chilena", "id": "L21.459 Art.18 N1", "descripcion": "Preservación provisoria de datos. Qué debe levantar: Verificar que se puede preservar de forma provisoria datos cuando lo requiera una autoridad, sin borrarlos.", "tema": "Normativa chilena"}, {"marco": "Normativa chilena", "id": "L20.393 Art.4", "descripcion": "Modelo de prevención de delitos vigente. Qué debe levantar: Verificar que existe un modelo de prevención de delitos (incluidos delitos informáticos y de datos) con políticas y controles.", "tema": "Normativa chilena"}, {"marco": "Normativa chilena", "id": "L20.393 Art.4 N3", "descripcion": "Encargado de prevención de delitos. Qué debe levantar: Verificar que existe una persona designada como encargado de prevención, con autoridad y reporte a la dirección.", "tema": "Normativa chilena"}, {"marco": "Normativa chilena", "id": "L20.393 Art.4 N2", "descripcion": "Protocolos y procedimientos de control. Qué debe levantar: Verificar que existen protocolos y procedimientos que controlan las actividades de riesgo (por ejemplo, pagos y compras).", "tema": "Normativa chilena"}, {"marco": "Normativa chilena", "id": "PNCS", "descripcion": "Política Nacional de Ciberseguridad. Qué debe levantar: Verificar que la organización conoce la Política Nacional de Ciberseguridad y la considera en su programa.", "tema": "Normativa chilena"}, {"marco": "Normativa chilena", "id": "L21.663 Ley de Ciberseguridad", "descripcion": "Ley 21.663 Marco de ciberseguridad. Qué debe levantar: Verificar si la organización está sujeta a la Ley 21.663 (servicios esenciales u operadores de importancia vital) y qué obligaciones de ciberseguridad y de reporte de incidentes le aplican.", "tema": "Normativa chilena"}], "reqs": [{"dim": "D1", "id": "1.1", "texto": "La organización tiene una política de protección de datos personales aprobada por la dirección y comunicada a todo el personal. Verificar: documento firmado, fecha de aprobación y constancia de difusión.", "controles": ["5.1", "NIST GV.PO-01"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D1", "id": "1.2", "texto": "Existe una persona designada formalmente como responsable de privacidad (DPO o equivalente), con funciones y autoridad escritas. Verificar: nombramiento, descripción de funciones y a quién reporta.", "controles": ["5.2", "5.3", "NIST GV.RR-02", "L21.719 Art.50", "L20.393 Art.4 N3"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D1", "id": "1.3", "texto": "La dirección asigna personas, herramientas y presupuesto para cumplir la ley. Verificar: presupuesto anual de privacidad y dedicación del responsable.", "controles": ["5.4", "NIST GV.RR-03"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D1", "id": "1.4", "texto": "Existe un programa de adecuación a la ley con modelo de prevención de infracciones documentado. Verificar: plan con responsables, fechas y avance.", "controles": ["5.31", "5.36", "NIST GV.OC-03", "L21.719 Programa adecuación", "L20.393 Art.4", "L21.719 Art.49", "L20.393 Art.4 N2"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D1", "id": "1.5", "texto": "Las evidencias de cumplimiento están ordenadas y se pueden presentar a la autoridad en cualquier momento. Verificar: carpeta de evidencias actualizada y con fechas.", "controles": ["5.36", "5.35", "NIST GV.PO-02"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D1", "id": "1.6", "texto": "Para cada tratamiento está definido si la organización actúa como responsable (decide para qué se usan los datos) o encargado (los trata por cuenta de otro). Verificar: matriz de roles por tratamiento.", "controles": ["5.31", "NIST GV.OC-02"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D1", "id": "1.7", "texto": "Existen contactos formales con la Agencia de Protección de Datos, el CPLT y la ANCI, y se mantienen actualizados. Verificar: directorio de contactos y fecha de la última actualización.", "controles": ["5.5", "5.6"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D1", "id": "1.8", "texto": "La dirección lidera la cultura de cumplimiento y el riesgo de privacidad forma parte de sus decisiones. Verificar: actas o reportes donde la dirección revisa privacidad.", "controles": ["NIST GV.RR-01", "NIST GV.OC-01"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D1", "id": "1.9", "texto": "Clientes, proveedores y otras partes externas conocen el compromiso de la organización con la privacidad y la seguridad. Verificar: políticas publicadas y declaraciones en contratos o sitio web.", "controles": ["NIST GV.OC-04", "NIST GV.OC-05"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D1", "id": "1.10", "texto": "Los procedimientos para tratar datos personales están escritos y disponibles para quien los usa. Verificar: lista de procedimientos con versión y fecha.", "controles": ["5.37"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D1", "id": "1.11", "texto": "Los sistemas que tratan datos cuentan con licencias vigentes y se controla el uso de software con propiedad intelectual. Verificar: inventario de licencias.", "controles": ["5.32"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D1", "id": "1.12", "texto": "Existen políticas técnicas escritas y aprobadas sobre control de acceso por roles, respaldos, malware, phishing y uso aceptable. Verificar: cada política, su fecha y quién la aprueba.", "controles": ["5.10", "5.1", "NIST GV.PO-01"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D1", "id": "1.13", "texto": "Comité de privacidad formal con actas que revisa tratamientos de alto riesgo y decisiones de cumplimiento.", "controles": ["5.4", "NIST GV.RR-01"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D1", "id": "1.14", "texto": "Evaluación de privacidad y seguridad antes de contratar proveedores tecnológicos nuevos (due diligence).", "controles": ["5.19", "5.21"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D2", "id": "2.1", "texto": "Existe un Registro de Actividades de Tratamiento (RAT) que describe, para cada actividad, la finalidad, la base legal, los tipos de datos, los titulares, los destinatarios, los plazos y las medidas de seguridad. Verificar: hoja RAT completa (indicador automático).", "controles": ["5.9", "RAT"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D2", "id": "2.2", "texto": "Existe un listado de los sistemas, aplicaciones y bases de datos que tratan datos personales. Verificar: inventario con nombre del sistema, dueño y tipo de datos.", "controles": ["5.9", "NIST ID.AM-02", "CIS 1"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D2", "id": "2.3", "texto": "Hay un diagrama de los flujos de datos personales dentro de la organización y hacia terceros (incluida la nube). Verificar: diagrama actualizado y su fecha.", "controles": ["NIST ID.AM-03"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D2", "id": "2.4", "texto": "El RAT se revisa al menos una vez al año y cada vez que cambia un proceso o sistema. Verificar: fecha de última revisión en la hoja RAT y registro de cambios.", "controles": ["NIST ID.AM-01", "5.9"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D2", "id": "2.5", "texto": "Los tratamientos de alto riesgo (por ejemplo, datos sensibles a gran escala, biometría o videovigilancia) están identificados en el RAT. Verificar: marca de riesgo en cada actividad.", "controles": ["NIST ID.AM-05"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D2", "id": "2.6", "texto": "Los datos personales están clasificados y etiquetados según su sensibilidad en repositorios y documentos. Verificar: esquema de clasificación y ejemplos etiquetados.", "controles": ["5.12", "5.13"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D2", "id": "2.7", "texto": "Los sistemas y datos se gestionan desde su adquisición hasta su baja, con responsable en cada etapa. Verificar: procedimiento de ciclo de vida.", "controles": ["NIST ID.AM-08"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D3", "id": "3.1", "texto": "Cada tratamiento de datos personales tiene una base legal (consentimiento, contrato, obligación legal, interés legítimo u otra) definida antes de iniciarse. Verificar: base legal registrada en el RAT.", "controles": ["5.34"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D3", "id": "3.2", "texto": "El consentimiento es libre, informado, específico e inequívoco, y no hay casillas premarcadas. Verificar: formularios reales con su captura de pantalla.", "controles": ["5.34"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D3", "id": "3.3", "texto": "Cada consentimiento queda registrado con fecha, canal, versión del aviso y la finalidad aceptada. Verificar: muestra de registros de consentimiento.", "controles": ["5.34", "5.33"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D3", "id": "3.4", "texto": "El titular puede revocar su consentimiento con la misma facilidad con que lo otorgó. Verificar: prueba del proceso de revocación (cuántos pasos y en qué canal).", "controles": ["5.34"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D3", "id": "3.5", "texto": "Cuando la base legal es interés legítimo, existe una evaluación escrita que pondera ese interés frente a los derechos del titular. Verificar: documento de ponderación por tratamiento.", "controles": ["5.34"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D3", "id": "3.6", "texto": "Al recolectar datos se entrega al titular el aviso de privacidad completo (quién trata, para qué, base legal, derechos y plazos). Verificar: aviso publicado y se muestra en cada punto de captura.", "controles": ["5.34"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D3", "id": "3.7", "texto": "Gestión de cookies con plataforma de consentimiento, con registro de versiones y posibilidad de revocar.", "controles": ["5.34", "8.23"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D4", "id": "4.1", "texto": "Existe un procedimiento formal para atender solicitudes de derechos (acceso, rectificación, supresión, oposición y portabilidad) y un canal publicado para presentarlas. Verificar: procedimiento y canal visible para el titular.", "controles": ["5.34", "ARCOP"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D4", "id": "4.2", "texto": "Los plazos de respuesta a las solicitudes están definidos y se monitorean. Verificar: plazo aplicado (según el texto oficial) y reporte de solicitudes fuera de plazo.", "controles": ["ARCOP"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D4", "id": "4.3", "texto": "Antes de entregar o modificar datos, se verifica la identidad del solicitante. Verificar: método de verificación usado.", "controles": ["5.34", "5.18"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D4", "id": "4.4", "texto": "La organización puede ubicar, rectificar, suprimir, exportar y restringir los datos de una persona en todos sus sistemas. Verificar: prueba práctica con un caso real o de prueba.", "controles": ["5.33", "8.10"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D4", "id": "4.5", "texto": "Cada solicitud, su respuesta y el motivo de cualquier rechazo quedan registrados. Verificar: hoja ARCOP completa.", "controles": ["5.33"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D4", "id": "4.6", "texto": "Si hay decisiones automatizadas que afectan al titular, se le informa y puede pedir revisión humana. Verificar: si existen decisiones automatizadas (por ejemplo, scoring de crédito o aprobación de clientes) y cómo se informan.", "controles": ["5.34"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D4", "id": "4.7", "texto": "Procedimiento para solicitudes ARCOP que llegan por canales informales (WhatsApp, redes sociales, call center), con registro y plazo.", "controles": ["5.34", "ARCOP"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D4", "id": "4.8", "texto": "La organización puede localizar los datos de un titular en todos sus sistemas y proveedores dentro de un plazo razonable. Verificar: prueba con un caso real o de prueba que muestre los sistemas consultados y el tiempo empleado.", "controles": ["5.33", "8.15"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D4", "id": "4.9", "texto": "Los datos entregados por portabilidad se exportan en un formato estructurado y de uso común. Verificar: archivo de ejemplo exportado y formato utilizado.", "controles": ["5.34"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D4", "id": "4.10", "texto": "Una supresión llega también a los respaldos y a los proveedores, con un procedimiento para hacerlo en plazos definidos. Verificar: procedimiento escrito y último caso ejecutado.", "controles": ["8.13", "5.20"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D5", "id": "5.1", "texto": "Los datos se usan solo para las finalidades declaradas al titular, sin usos incompatibles posteriores. Verificar: finalidades del aviso frente a usos reales en los sistemas.", "controles": ["5.34"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D5", "id": "5.2", "texto": "Solo se recolectan y mantienen los datos estrictamente necesarios para la finalidad. Verificar: formularios con campos justificados y revisión de campos innecesarios.", "controles": ["5.34", "8.11"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D5", "id": "5.3", "texto": "Existen mecanismos para mantener los datos exactos y actualizados. Verificar: cómo se corrigen datos y con qué frecuencia se revisan.", "controles": ["5.34"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D5", "id": "5.4", "texto": "Existe una política de retención con plazos concretos para cada categoría de dato. Verificar: tabla de retención con plazos y base legal.", "controles": ["5.33"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D5", "id": "5.5", "texto": "Al cumplirse el plazo, los datos se eliminan o anonimizan de forma segura, y queda evidencia. Verificar: registro de una eliminación reciente.", "controles": ["8.10"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D5", "id": "5.6", "texto": "Los datos obtenidos de terceros o de fuentes públicas se validan en cuanto a su origen y licitud antes de usarlos. Verificar: origen documentado de cada base comprada o recibida.", "controles": ["5.19", "5.14"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D5", "id": "5.7", "texto": "Minimización en formularios web y POS: solo campos obligatorios justificados por la finalidad.", "controles": ["5.34", "8.11"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D5", "id": "5.8", "texto": "Eliminación automática de datos según la tabla de retención.", "controles": ["5.33", "8.10"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D5", "id": "5.9", "texto": "Existe una tabla de retención por categoría de dato y las eliminaciones se ejecutan y quedan registradas. Verificar: último registro de eliminación, con fecha y responsable.", "controles": ["5.33", "8.10"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D5", "id": "5.10", "texto": "Cada eliminación deja evidencia: qué se eliminó, cuándo, por quién y cómo se verificó. Verificar: muestra de tres registros de eliminación.", "controles": ["8.10"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D6", "id": "6.1", "texto": "Los datos sensibles (salud, biométricos, origen, creencias, antecedentes penales) y los de menores están identificados en el inventario. Verificar: lista de datos sensibles por sistema.", "controles": ["5.12", "5.9"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D6", "id": "6.2", "texto": "Para tratar datos sensibles se obtiene consentimiento explícito del titular. Verificar: formulario de consentimiento específico para datos sensibles.", "controles": ["5.34"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D6", "id": "6.3", "texto": "Los datos sensibles tienen controles reforzados: acceso restringido, cifrado y registro de accesos. Verificar: matriz de acceso y logs de esos datos.", "controles": ["8.11", "8.24"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D6", "id": "6.4", "texto": "Si se tratan datos de niños, niñas o adolescentes, se aplica el interés superior del menor y se obtiene el consentimiento de su representante cuando corresponde. Verificar: si hay tratamientos con menores y cómo se controlan.", "controles": ["5.34"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D6", "id": "6.5", "texto": "El tratamiento biométrico y la vigilancia sistemática tienen restricciones y justificación escrita. Verificar: si existe biometría o vigilancia y su justificación.", "controles": ["5.34"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D6", "id": "6.6", "texto": "Verificación de edad en ecommerce cuando se venden productos restringidos.", "controles": ["5.34"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D7", "id": "7.1", "texto": "Están definidos criterios de alto riesgo y se comunican a las áreas que proponen nuevos tratamientos. Verificar: criterios escritos y su difusión.", "controles": ["5.34"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D7", "id": "7.2", "texto": "Se realiza una evaluación de impacto en protección de datos (EIPD/DPIA) antes de iniciar cada tratamiento de alto riesgo. Verificar: EIPD existentes y su fecha.", "controles": ["5.34", "5.8"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D7", "id": "7.3", "texto": "La privacidad se revisa como parte de la gestión de proyectos y de los cambios a sistemas. Verificar: checklist de privacidad en la metodología de proyectos.", "controles": ["5.8", "8.25", "8.27"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D7", "id": "7.4", "texto": "Por defecto, los sistemas y productos tratan el mínimo de datos y dan el mínimo de accesos. Verificar: configuración por defecto en formularios y sistemas.", "controles": ["8.9"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D7", "id": "7.5", "texto": "Si el riesgo residual de un tratamiento es alto, existe un procedimiento para consultar a la autoridad antes de iniciarlo. Verificar: procedimiento escrito.", "controles": ["5.34"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D7", "id": "7.6", "texto": "Las decisiones que afectan a personas y se toman solo por sistemas automáticos están identificadas. Verificar: inventario de decisiones automatizadas (por ejemplo, scoring, aprobaciones o precios personalizados).", "controles": ["5.34"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D7", "id": "7.7", "texto": "Ante una decisión automatizada, el titular puede pedir información sobre su lógica y solicitar revisión por una persona. Verificar: procedimiento escrito y un caso de prueba documentado.", "controles": ["5.34", "5.8"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D8", "id": "8.1", "texto": "Existe un sistema de gestión de seguridad de la información (ISO/IEC 27001) implementado o en implementación. Verificar: alcance del SGSI y su avance.", "controles": ["5.1"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D8", "id": "8.2", "texto": "El acceso a los sistemas sigue el principio de mínimo privilegio, con separación de funciones y revisión periódica. Verificar: matriz de accesos y última revisión.", "controles": ["8.2", "5.15"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D8", "id": "8.3", "texto": "Todos los sistemas que contienen datos personales exigen autenticación multifactor (MFA). Verificar: lista de sistemas con MFA activo y los que no lo tienen.", "controles": ["5.17", "8.5"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D8", "id": "8.4", "texto": "Los datos se cifran en tránsito y en reposo, incluidos respaldos y equipos portátiles. Verificar: configuración de cifrado por sistema y en equipos.", "controles": ["8.24"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D8", "id": "8.5", "texto": "Las vulnerabilidades se corrigen con plazos según su criticidad. Verificar: último escaneo, hallazgos abiertos y plazos de parcheo.", "controles": ["8.8", "CIS 7"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D8", "id": "8.6", "texto": "Los accesos a datos personales quedan registrados, los registros están protegidos y tienen plazo de retención. Verificar: logs de accesos y su retención.", "controles": ["8.15"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D8", "id": "8.7", "texto": "Los respaldos están cifrados y se prueban restaurándolos. Verificar: última prueba de restauración documentada.", "controles": ["8.13"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D8", "id": "8.8", "texto": "Se realizan pruebas de intrusión o evaluaciones técnicas al menos una vez al año, y los hallazgos críticos se cierran. Verificar: informe de pentest del último año.", "controles": ["8.8", "5.35"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D8", "id": "8.9", "texto": "Los datos se seudonimizan o anonimizan cuando la finalidad lo permite. Verificar: casos donde se aplica y donde podría aplicarse.", "controles": ["8.11"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D8", "id": "8.10", "texto": "Las cuentas privilegiadas (administradores) tienen control reforzado y sus sesiones quedan registradas. Verificar: lista de cuentas privilegiadas y herramienta de control.", "controles": ["8.2", "8.16"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D8", "id": "8.11", "texto": "Los equipos de usuario tienen MDM, cifrado y EDR. Verificar: cobertura de cada herramienta sobre el parque de equipos.", "controles": ["8.1"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D8", "id": "8.12", "texto": "Servidores y equipos tienen protección contra malware actualizada y monitoreada. Verificar: porcentaje de equipos con EDR y alertas recientes.", "controles": ["8.7", "CIS 10"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D8", "id": "8.13", "texto": "El acceso al código fuente y a la información está restringido por rol. Verificar: permisos del repositorio y de carpetas críticas.", "controles": ["8.3", "8.4"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D8", "id": "8.14", "texto": "Existen controles para evitar la fuga de datos (envíos masivos, copias a dispositivos externos). Verificar: reglas de DLP o equivalentes y su alerta.", "controles": ["8.12"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D8", "id": "8.15", "texto": "Se controla la capacidad de los servicios y la sincronización horaria de los sistemas. Verificar: monitoreo de capacidad y configuración NTP.", "controles": ["8.6", "8.17"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D8", "id": "8.16", "texto": "Las redes están segmentadas y protegidas con firewalls y servicios de red seguros. Verificar: diagrama de red y reglas de firewall.", "controles": ["8.20", "8.21", "8.22", "8.23"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D8", "id": "8.17", "texto": "Las herramientas de administración con privilegios están restringidas y solo se instala software autorizado. Verificar: lista de herramientas privilegiadas y de software permitido.", "controles": ["8.18", "8.19", "CIS 2"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D8", "id": "8.18", "texto": "Las identidades y credenciales de usuarios, servicios y equipos se gestionan con procedimiento y registro. Verificar: proceso de alta y baja con tickets.", "controles": ["5.16", "NIST PR.AA-01", "NIST PR.AA-02", "CIS 5"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D8", "id": "8.19", "texto": "Los accesos verifican la autenticación de cada usuario y protegen las aserciones de identidad. Verificar: configuración de autenticación y tokens.", "controles": ["NIST PR.AA-03", "NIST PR.AA-04", "5.17"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D8", "id": "8.20", "texto": "Los permisos se asignan por mínimo privilegio y se revisan periódicamente. Verificar: última revisión de accesos (recertificación).", "controles": ["5.18", "NIST PR.AA-05", "CIS 6"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D8", "id": "8.21", "texto": "Los respaldos están protegidos, separados del sistema principal y resguardados. Verificar: ubicación de los respaldos y control de acceso.", "controles": ["NIST PR.DS-11"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D8", "id": "8.22", "texto": "Las aplicaciones se desarrollan con requisitos de seguridad, codificación segura y pruebas antes de salir a producción. Verificar: procedimiento de desarrollo y evidencia de pruebas.", "controles": ["8.26", "8.28", "8.29"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D8", "id": "8.23", "texto": "Si se externaliza desarrollo, el proveedor cumple requisitos de seguridad, y los entornos de desarrollo, prueba y producción están separados. Verificar: contratos y diagrama de entornos.", "controles": ["8.30", "8.31", "8.33"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D8", "id": "8.24", "texto": "Los cambios a sistemas en producción se aprueban, prueban y registran antes de implementarse. Verificar: registro de cambios de los últimos meses.", "controles": ["8.32", "BAI06"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D8", "id": "8.25", "texto": "Existe un modelo RBAC documentado (roles, perfiles y matriz de accesos) revisado periódicamente. Verificar: matriz de roles y fecha de revisión.", "controles": ["5.15", "5.18", "NIST PR.AA-05", "PCI Req 7"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D8", "id": "8.26", "texto": "El acceso al entorno de pagos exige autenticación fuerte según PCI DSS (requisitos 8). Verificar: MFA en acceso a entornos de pago.", "controles": ["8.5", "PCI Req 8"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D8", "id": "8.27", "texto": "Los equipos del entorno de pagos tienen antivirus o EDR actualizado y monitoreado (PCI DSS requisito 5). Verificar: cobertura y última alerta.", "controles": ["8.7", "PCI Req 5"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D8", "id": "8.28", "texto": "Prevención de fuga de datos (DLP) en correo y nube.", "controles": ["8.12"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D8", "id": "8.29", "texto": "Política de dispositivos personales (BYOD) y de trabajo remoto con cifrado y borrado remoto.", "controles": ["8.1", "6.7"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D9", "id": "9.1", "texto": "Existe un procedimiento de respuesta a incidentes con roles y responsabilidades asignados. Verificar: procedimiento y nombres de responsables.", "controles": ["5.24", "NIST RS.MA-01", "CIS 17"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D9", "id": "9.2", "texto": "Existe un mecanismo para detectar y registrar vulneraciones que afecten datos personales. Verificar: fuentes de detección (alertas, reportes del personal) y registro.", "controles": ["6.8", "5.25", "NIST RS.AN-07"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D9", "id": "9.3", "texto": "Las vulneraciones que afectan datos personales se notifican a la autoridad dentro del plazo legal. Verificar: plazo exacto según el texto oficial y el procedimiento que lo cumple.", "controles": ["5.26", "L21.719 Art.14 sexies"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D9", "id": "9.4", "texto": "Cuando hay riesgo elevado para los titulares, se les notifica sin demora. Verificar: criterio de riesgo y canal de notificación.", "controles": ["5.26", "NIST RS.CO-02"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D9", "id": "9.5", "texto": "Existen plantillas listas de notificación a la autoridad y a los titulares. Verificar: plantillas vigentes.", "controles": ["5.26", "NIST RS.CO-03"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D9", "id": "9.6", "texto": "Se realiza al menos una vez al año un simulacro de brecha de datos personales. Verificar: fecha y resultados del último simulacro.", "controles": ["5.24"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D9", "id": "9.7", "texto": "Cada vulneración queda registrada con causa raíz, impacto y acciones correctivas. Verificar: bitácora de incidentes.", "controles": ["5.27", "NIST RS.AN-03"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D9", "id": "9.8", "texto": "Existe un plan de continuidad y recuperación ante desastres con RTO y RPO definidos y probados. Verificar: plan, RTO y RPO por sistema y resultado de la última prueba.", "controles": ["5.29", "5.30", "8.14"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D9", "id": "9.9", "texto": "Los incidentes se clasifican, priorizan y escalan con criterios escritos. Verificar: matriz de severidad y reglas de escalamiento.", "controles": ["NIST RS.MA-02", "NIST RS.MA-03", "NIST RS.MA-04", "NIST RS.MA-05"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D9", "id": "9.10", "texto": "Se estima la magnitud de cada incidente (datos y personas afectadas) y se recolecta la evidencia. Verificar: plantilla de evaluación y de evidencia.", "controles": ["NIST RS.AN-08", "5.28"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D9", "id": "9.11", "texto": "Cadena de custodia documentada para la evidencia de incidentes.", "controles": ["5.28"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D9", "id": "9.12", "texto": "Seguro de ciberseguridad revisado en relación con las obligaciones de notificación.", "controles": ["5.31"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D10", "id": "10.1", "texto": "Existe un inventario de los proveedores que tratan datos personales por cuenta de la organización. Verificar: listado con tipo de datos tratados.", "controles": ["5.19"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D10", "id": "10.2", "texto": "Los contratos con proveedores que tratan datos incluyen las cláusulas exigidas: objeto, duración, obligaciones, subencargo y eliminación al término. Verificar: muestra de contratos.", "controles": ["5.20"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D10", "id": "10.3", "texto": "Los proveedores se evalúan en seguridad y privacidad antes de contratar y periódicamente. Verificar: cuestionario de evaluación y fecha.", "controles": ["5.21", "5.22"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D10", "id": "10.4", "texto": "Los contratos permiten auditar al proveedor. Verificar: cláusula de auditoría en contratos.", "controles": ["5.20"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D10", "id": "10.5", "texto": "Las transferencias de datos fuera de Chile solo se hacen a países con nivel adecuado o con garantías contractuales. Verificar: hoja Transferencias completa (indicador automático).", "controles": ["5.14", "TRANSF"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D10", "id": "10.6", "texto": "Los terceros que acceden a información firman acuerdos de confidencialidad. Verificar: acuerdos firmados.", "controles": ["6.6"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D10", "id": "10.7", "texto": "Los servicios en la nube se evalúan y se gestionan con criterios de seguridad y privacidad. Verificar: inventario de servicios cloud y su evaluación.", "controles": ["5.23"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D10", "id": "10.8", "texto": "Los sub-encargados (proveedores de tus proveedores) están identificados y autorizados por contrato. Verificar: lista de sub-encargados por proveedor.", "controles": ["5.20", "5.21"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D10", "id": "10.9", "texto": "Al terminar un contrato, el proveedor devuelve o elimina los datos y entrega certificado. Verificar: cláusula y ejemplo de cierre de contrato.", "controles": ["5.20", "8.10"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D10", "id": "10.10", "texto": "Cláusulas tipo de transferencia internacional revisadas al menos una vez al año para proveedores de marketing y nube.", "controles": ["5.14", "5.20"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D11", "id": "11.1", "texto": "Todo el personal recibe capacitación en protección de datos al ingresar y al menos una vez al año. Verificar: registro de asistencia y porcentaje de cumplimiento.", "controles": ["6.3"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D11", "id": "11.2", "texto": "La capacitación tiene contenidos según el rol (TI, ventas, RRHH, atención al cliente, dirección). Verificar: programa por rol.", "controles": ["6.3"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D11", "id": "11.3", "texto": "Se realizan campañas de concienciación y simulacros de phishing con métricas. Verificar: resultados del último simulacro.", "controles": ["6.3", "6.8"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D11", "id": "11.4", "texto": "Todo el personal y los contratistas firman compromisos de confidencialidad. Verificar: firmas en expedientes o contratos.", "controles": ["6.6"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D11", "id": "11.5", "texto": "El proceso de selección y los contratos de trabajo incluyen cláusulas de privacidad. Verificar: contrato tipo con la cláusula.", "controles": ["6.1", "6.2"], "tipo": "Obligatorio Ley 21.71
