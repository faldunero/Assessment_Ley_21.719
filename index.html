9", "incluir": true}, {"dim": "D11", "id": "11.6", "texto": "Existe un proceso disciplinario para quienes incumplen las políticas de datos. Verificar: reglamento interno y casos aplicados.", "controles": ["6.4"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D11", "id": "11.7", "texto": "Al terminar o cambiar de cargo, se revocan accesos y se devuelven activos con registro. Verificar: checklist de salida de los últimos casos.", "controles": ["6.5", "5.11"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D11", "id": "11.8", "texto": "El trabajo remoto y el uso aceptable de la información tienen reglas escritas. Verificar: política de trabajo remoto.", "controles": ["6.7", "5.10"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D11", "id": "11.9", "texto": "La contratación, evaluación y salida de personal incluyen requisitos de ciberseguridad y privacidad. Verificar: procesos de RRHH con esos requisitos.", "controles": ["NIST GV.RR-04"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D11", "id": "11.10", "texto": "Existen filtros de correo, MFA y simulacros de phishing con métricas. Verificar: herramientas usadas y resultados.", "controles": ["CIS 9", "6.3", "6.8"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D12", "id": "12.1", "texto": "Existe un plan anual de auditoría interna de cumplimiento aprobado. Verificar: plan aprobado y fecha.", "controles": ["5.35"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D12", "id": "12.2", "texto": "Se miden y reportan a la dirección indicadores de privacidad: solicitudes ARCOP, incidentes, capacitación y EIPD. Verificar: último reporte a la dirección.", "controles": ["5.4"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D12", "id": "12.3", "texto": "Los hallazgos de auditoría tienen plan de acción, responsable y plazo. Verificar: seguimiento de hallazgos abiertos.", "controles": ["5.35", "5.36"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D12", "id": "12.4", "texto": "La política y el programa de cumplimiento se revisan al menos una vez al año. Verificar: fecha de última revisión.", "controles": ["5.1"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D12", "id": "12.5", "texto": "Se monitorean cambios en leyes, reglamentos y criterios de la autoridad de control. Verificar: quién monitorea y cómo se comunica.", "controles": ["5.31", "5.7"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D12", "id": "12.6", "texto": "Las auditorías se realizan sin afectar la operación ni los datos de producción. Verificar: procedimiento de auditoría.", "controles": ["8.34"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D13", "id": "13.1", "texto": "Las vulnerabilidades de los sistemas que tratan datos personales se identifican, validan y registran. Verificar: último escaneo y registro de hallazgos.", "controles": ["NIST ID.RA-01"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D13", "id": "13.2", "texto": "Existe un canal y un proceso para recibir y responder reportes de vulnerabilidades de terceros. Verificar: canal publicado y responsable.", "controles": ["NIST ID.RA-08"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D13", "id": "13.3", "texto": "Los sistemas con datos personales tienen configuración segura documentada. Verificar: configuraciones base y su revisión.", "controles": ["NIST PR.PS-01", "CIS 4"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D13", "id": "13.4", "texto": "El software y hardware sin soporte del fabricante se retiran o se aíslan si contienen datos personales. Verificar: inventario de equipos y software sin soporte.", "controles": ["NIST PR.PS-02", "NIST PR.PS-03"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D13", "id": "13.5", "texto": "El software no autorizado se bloquea y se registra. Verificar: lista de software permitido y alertas de instalación.", "controles": ["NIST PR.PS-05", "CIS 2"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D13", "id": "13.6", "texto": "El correo y la navegación están protegidos contra phishing y sitios maliciosos. Verificar: filtros activos.", "controles": ["CIS 9"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D13", "id": "13.7", "texto": "Todos los endpoints y servidores tienen defensas contra malware. Verificar: cobertura de antivirus o EDR.", "controles": ["CIS 10"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D13", "id": "13.8", "texto": "Las acciones y datos de los incidentes quedan registrados con integridad y origen. Verificar: registro de un incidente reciente.", "controles": ["NIST RS.AN-06", "NIST RS.AN-07"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D13", "id": "13.9", "texto": "La evidencia electrónica se preserva según la Ley 21.459 (arts. 14 y 18 N°1) dentro del procedimiento de incidentes. Verificar: procedimiento de preservación.", "controles": ["L21.459 Art.14", "L21.459 Art.18 N1"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D13", "id": "13.10", "texto": "Los incidentes con datos personales se contienen y se erradican con pasos documentados. Verificar: procedimiento y último caso.", "controles": ["NIST RS.MI-01", "NIST RS.MI-02"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D13", "id": "13.11", "texto": "Los respaldos se verifican antes de restaurar datos personales. Verificar: procedimiento de verificación y última restauración.", "controles": ["NIST RC.RP-03", "CIS 11"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D13", "id": "13.12", "texto": "Los cambios tienen evaluación de impacto en privacidad y aceptación formal (COBIT BAI06 y BAI07). Verificar: formulario de cambio con esos campos.", "controles": ["BAI06", "BAI07"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D13", "id": "13.13", "texto": "Los activos y las configuraciones se gestionan durante todo su ciclo de vida (COBIT BAI09 y BAI10). Verificar: inventario y registro de configuración.", "controles": ["BAI09", "BAI10"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D13", "id": "13.14", "texto": "Los sistemas con datos personales siguen los benchmarks de configuración aplicables (sistemas operativos, bases de datos, redes, aplicaciones, nube y suite de oficina). Verificar: benchmark usado y cumplimiento.", "controles": ["BM-OS", "BM-CLOUD", "BM-DB", "BM-NET", "BM-APP", "BM-M365"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D13", "id": "13.15", "texto": "El entorno de pagos cumple PCI DSS requisitos 2 y 5 (configuración segura y malware). Verificar: aplica solo si la organización procesa tarjetas; indicar N/A si no.", "controles": ["PCI Req 2", "PCI Req 5"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D13", "id": "13.16", "texto": "El entorno de pagos cumple PCI DSS requisitos 7 y 8 (acceso y autenticación). Verificar: aplica solo si procesa tarjetas; indicar N/A si no.", "controles": ["PCI Req 7", "PCI Req 8"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D13", "id": "13.17", "texto": "El modelo de prevención de delitos de la Ley 20.393 (art. 4) está integrado con el programa de datos personales. Verificar: modelo vigente y su vínculo con privacidad.", "controles": ["L20.393 Art.4"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D13", "id": "13.18", "texto": "El programa de cumplimiento está alineado con la Política Nacional de Ciberseguridad. Verificar: mapeo de la política con el programa.", "controles": ["PNCS"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D13", "id": "13.19", "texto": "Los contenedores y su orquestación siguen benchmarks de configuración. Verificar: aplica solo si hay contenedores; indicar N/A si no.", "controles": ["BM-CONT"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D13", "id": "13.20", "texto": "El alcance del entorno de pagos (tiendas, bodegas y ecommerce) está identificado y segmentado. Verificar: diagrama de alcance.", "controles": ["PCI Req 2", "PCI Req 7"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D13", "id": "13.21", "texto": "Ley 21.663 de Ciberseguridad identificada y cruzada con las obligaciones de la Ley 21.719.", "controles": ["L21.663 Ley de Ciberseguridad", "5.31"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D14", "id": "14.1", "texto": "Las áreas sensibles tienen perímetro físico y control de entrada. Verificar: tarjetas, biométrico o libro de ingreso.", "controles": ["7.1", "7.2"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D14", "id": "14.2", "texto": "Oficinas, recintos y áreas seguras están protegidos. Verificar: políticas de acceso y revisión de instalaciones.", "controles": ["7.3", "7.6"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D14", "id": "14.3", "texto": "Existe monitoreo físico (CCTV, alarmas) y protección frente a incendio, inundación u otras amenazas. Verificar: sistemas instalados y su mantenimiento.", "controles": ["7.4", "7.5"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D14", "id": "14.4", "texto": "Hay reglas de escritorio limpio y pantalla bloqueada, y los equipos están ubicados para evitar accesos indebidos. Verificar: revisión de puestos de trabajo.", "controles": ["7.7", "7.8"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D14", "id": "14.5", "texto": "Los equipos y datos fuera de la oficina están protegidos, los medios removibles están controlados y la eliminación de equipos es segura. Verificar: procedimiento y certificados de destrucción.", "controles": ["7.9", "7.10", "7.14"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D14", "id": "14.6", "texto": "Energía, cableado y mantenimiento de equipos están protegidos y registrados. Verificar: UPS, planos de cableado y registro de mantenimientos.", "controles": ["7.11", "7.12", "7.13"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D15", "id": "15.1", "texto": "Existe inventario y clasificación de servidores, equipos de red y servicios en la nube. Verificar: inventario con criticidad.", "controles": ["CIS 1", "NIST ID.AM-01"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D15", "id": "15.2", "texto": "Los sistemas operativos tienen configuración segura según un benchmark reconocido. Verificar: benchmark usado y resultado.", "controles": ["BM-OS", "CIS 4"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D15", "id": "15.3", "texto": "La red está segmentada por nivel de sensibilidad (VLAN, zonas y reglas de firewall). Verificar: diagrama y reglas.", "controles": ["8.22", "8.20", "NIST ID.AM-03"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D15", "id": "15.4", "texto": "Las bases de datos tienen configuración segura y el acceso privilegiado está controlado. Verificar: inventario de bases y cuentas administradoras.", "controles": ["BM-DB", "8.2"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D15", "id": "15.5", "texto": "Las bases de datos y los datos personales en reposo están cifrados. Verificar: configuración de cifrado por base.", "controles": ["8.24", "8.11"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D15", "id": "15.6", "texto": "Las consultas y cambios sobre datos personales en bases de datos quedan registradas. Verificar: auditoría activa y retención.", "controles": ["8.15", "8.16"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D15", "id": "15.7", "texto": "Los datos personales se enmascaran o anonimizan en entornos de prueba. Verificar: entornos de prueba y datos usados.", "controles": ["8.33", "8.11"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D15", "id": "15.8", "texto": "Las comunicaciones externas usan TLS 1.2 o superior y el acceso remoto usa VPN. Verificar: configuración de los servicios expuestos y de la VPN.", "controles": ["8.24", "6.7", "8.20"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D15", "id": "15.9", "texto": "El correo y la navegación están filtrados, con autenticación de dominio (SPF, DKIM, DMARC) y bloqueo de sitios riesgosos. Verificar: configuración del dominio y del filtro.", "controles": ["CIS 9", "8.23"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D15", "id": "15.10", "texto": "Los servicios en nube y los contenedores tienen configuración segura. Verificar: revisión de configuración en la nube.", "controles": ["BM-CLOUD", "BM-CONT", "5.23"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D15", "id": "15.11", "texto": "Las plataformas de productividad (por ejemplo, Microsoft 365) están configuradas según benchmark. Verificar: configuración de seguridad de la suite.", "controles": ["BM-M365", "CIS 4"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D15", "id": "15.12", "texto": "Las bases de datos se respaldan y se prueba su restauración. Verificar: última prueba documentada.", "controles": ["8.13", "CIS 11", "NIST RC.RP-03"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D15", "id": "15.13", "texto": "Los entornos de pago (ecommerce, POS y bodegas) tienen configuración segura (PCI DSS 2 y 5). Verificar: aplica solo si procesa tarjetas.", "controles": ["PCI Req 2", "PCI Req 5"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D15", "id": "15.14", "texto": "La recuperación ante desastres tiene RTO y RPO probados para bases de datos y sistemas críticos. Verificar: valores definidos y última prueba.", "controles": ["5.30", "8.14"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D16", "id": "16.1", "texto": "Los cambios se evalúan por impacto en privacidad antes de aprobarse (COBIT BAI06). Verificar: formulario de cambio.", "controles": ["BAI06", "8.32"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D16", "id": "16.2", "texto": "Los cambios se aceptan formalmente antes de pasar a producción (COBIT BAI07). Verificar: aprobación registrada.", "controles": ["BAI07", "8.29"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D16", "id": "16.3", "texto": "Los activos de TI se gestionan durante todo su ciclo de vida (COBIT BAI09). Verificar: inventario con estado y responsable.", "controles": ["BAI09", "5.9"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D16", "id": "16.4", "texto": "La configuración de los elementos de TI se registra y se mantiene actualizada (COBIT BAI10). Verificar: registro de configuración (CMDB u otro).", "controles": ["BAI10", "8.9"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D16", "id": "16.5", "texto": "El riesgo de TI se integra con la gestión de riesgos del SGSI y se reporta a la dirección. Verificar: último reporte de riesgo.", "controles": ["NIST GV.RR-03", "NIST GV.OC-02"], "tipo": "Extra (marco o buena práctica)", "incluir": false}, {"dim": "D17", "id": "17.1", "texto": "Los candidatos reciben un aviso de privacidad y su CV y entrevistas se usan solo para la selección. Verificar: aviso en el proceso de postulación.", "controles": ["5.34", "6.1"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D17", "id": "17.2", "texto": "Los CV de candidatos no contratados se eliminan al cumplirse un plazo definido. Verificar: plazo y evidencia de eliminación.", "controles": ["8.10", "5.33"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D17", "id": "17.3", "texto": "Las evaluaciones psicológicas, tests y perfilamiento de candidatos tienen base legal y decisiones revisadas por una persona. Verificar: qué tests se usan y quién decide.", "controles": ["5.34", "6.1"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D17", "id": "17.4", "texto": "Los contratos de trabajo y sus anexos incluyen cláusulas de privacidad y confidencialidad. Verificar: contrato tipo y anexos.", "controles": ["6.2", "6.6"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D17", "id": "17.5", "texto": "En el onboarding se entregan las políticas y se asignan accesos según el rol aprobado. Verificar: checklist de ingreso.", "controles": ["6.3", "5.18"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D17", "id": "17.6", "texto": "En el offboarding se revocan accesos, se devuelven activos y se cierra el expediente. Verificar: checklist de salida con fechas.", "controles": ["6.5", "5.11", "5.18"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D17", "id": "17.7", "texto": "El expediente de cada empleado tiene acceso restringido, plazo de retención y eliminación al vencer. Verificar: quién accede al expediente y plazo aplicado.", "controles": ["5.33", "8.10"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D17", "id": "17.8", "texto": "Los datos de salud (licencias médicas, certificados) están separados del expediente general y con acceso restringido. Verificar: dónde se guardan y quién los ve.", "controles": ["5.34", "8.11"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D17", "id": "17.9", "texto": "Las evaluaciones de desempeño y de otro tipo tienen finalidad declarada, y el titular puede acceder a su resultado. Verificar: política de evaluaciones.", "controles": ["5.34", "5.37"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D17", "id": "17.10", "texto": "Los registros de capacitación y cursos tienen retención y acceso definidos. Verificar: dónde se guardan y por cuánto tiempo.", "controles": ["6.3"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D17", "id": "17.11", "texto": "El control de asistencia y acceso con huella o reconocimiento facial trata un dato biométrico: exige consentimiento explícito y medidas reforzadas. Verificar: si el control usa biometría y, de ser así, el consentimiento obtenido.", "controles": ["5.34", "7.2", "8.15"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D17", "id": "17.12", "texto": "La videovigilancia en tiendas y bodegas tiene aviso visible, finalidad definida y plazo de retención. Verificar: avisos instalados y plazo de grabación.", "controles": ["7.4", "5.34"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D17", "id": "17.13", "texto": "El monitoreo del correo y los equipos de trabajo está informado al personal y es proporcional. Verificar: política de monitoreo firmada.", "controles": ["5.34", "8.15"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D17", "id": "17.14", "texto": "La transferencia de datos de nómina a previsión y salud tiene base legal documentada. Verificar: convenio o base legal de cada transferencia.", "controles": ["5.19", "5.14"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D18", "id": "18.1", "texto": "El origen de las bases de datos de clientes, leads y prospectos (propias o compradas) está documentado y es lícito. Verificar: origen y contrato de cada base comprada.", "controles": ["5.34", "5.14"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D18", "id": "18.2", "texto": "El marketing a personas naturales requiere consentimiento; la prospección B2B tiene base legal documentada. Verificar: formularios y base legal del envío comercial.", "controles": ["5.34"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D18", "id": "18.3", "texto": "Las cookies y el seguimiento web requieren consentimiento previo, y los terceros que rastrean están informados. Verificar: banner de cookies y lista de terceros.", "controles": ["5.34", "8.23"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D18", "id": "18.4", "texto": "Los datos de compras y pagos en ecommerce tienen control de acceso y cifrado. Verificar: configuración de la plataforma de venta.", "controles": ["8.24", "PCI Req 7"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D18", "id": "18.5", "texto": "El perfilamiento y la segmentación de clientes se informan al titular y, si aplica, tienen evaluación de impacto. Verificar: si hay perfilamiento y cómo se informa.", "controles": ["5.34", "5.8"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D18", "id": "18.6", "texto": "Los programas de fidelización y puntos tienen finalidad declarada y consentimiento. Verificar: términos del programa.", "controles": ["5.34", "5.9"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D18", "id": "18.7", "texto": "El opt-out de marketing se atiende de inmediato y queda registrado. Verificar: prueba de desuscripción y registro.", "controles": ["5.34", "8.10"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D18", "id": "18.8", "texto": "Los leads y clientes inactivos se eliminan o anonimizan al cumplir un plazo definido. Verificar: plazo y última depuración.", "controles": ["8.10", "5.33"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D18", "id": "18.9", "texto": "Las grabaciones de call center tienen aviso, finalidad y plazo de retención. Verificar: aviso al inicio de la llamada y plazo configurado.", "controles": ["5.34", "8.15"], "tipo": "Obligatorio Ley 21.719", "incluir": true}, {"dim": "D18", "id": "18.10", "texto": "El acceso al CRM está restringido por rol y se controlan las exportaciones masivas. Verificar: permisos del CRM y registro de exportaciones.", "controles": ["8.3", "8.12"], "tipo": "Obligatorio Ley 21.719", "incluir": true}], "schemas": {"rat": [{"k": "f0", "label": "ID", "type": "text"}, {"k": "f1", "label": "Actividad / Proceso", "type": "text"}, {"k": "f2", "label": "Finalidad del Tratamiento /* Migra datos guardados por versiones anteriores: conserva lo que el usuario cargó
   (entrevistas, filas, decisiones de inclusión, metadatos) y toma la estructura del archivo actual. */
function migrar(g){
  const base = JSON.parse(JSON.stringify(SEED));
  base.entrevistas=[]; base.historial=[];
  if(!g) return base;
  base.entrevistas = Array.isArray(g.entrevistas)? g.entrevistas : [];
  base.historial = Array.isArray(g.historial)? g.historial : [];
  base.registros = Array.isArray(g.registros) ? g.registros : [];
  base.meta = Object.assign(base.meta, g.meta||{});
  const incl = {}; (g.reqs||[]).forEach(q=>{ incl[q.id]=q.incluir; });
  base.reqs.forEach(q=>{ if(q.id in incl) q.incluir = incl[q.id]; });
  ['rat','arcop','transf'].forEach(t=>{
    const cols = base.schemas[t].map(c=>c.k);
    const viejas = (g.tables && Array.isArray(g.tables[t])) ? g.tables[t] : [];
    base.tables[t] = viejas.map(r=>{ const n={}; cols.forEach(k=>n[k]= r[k]==null? '' : r[k]); return n; });
  });
  const kfa=(pal)=>{ const c=base.schemas.rat.find(x=>x.label.toLowerCase().includes(pal.toLowerCase())); return c?c.k:null; };
  const ka=kfa('Actividad');
  base.tables.rat.forEach(r=>{ const it=base.catRat.find(x=>x.actividad===r[ka]); if(it) llenarRat(r,it,base.schemas.rat,false,base.meta.area); });
  return base;
}

const NIVELES_TXT = {crit:'Crítico',ini:'Inicial',des:'En desarrollo',ava:'Avanzado',opt:'Optimizado',sin:'Sin evaluar'};
function nivel(x){
  if(x==null) return NIVELES_TXT.sin;
  if(x<2) return NIVELES_TXT.crit;
  if(x<3) return NIVELES_TXT.ini;
  if(x<4) return NIVELES_TXT.des;
  if(x<4.6) return NIVELES_TXT.ava;
  return NIVELES_TXT.opt;
}
function num(v){ if(v===''||v==null) return null; const n=Number(v); return isNaN(n)? null : n; }
function promedio(a){ const v=a.filter(x=>x!=null); return v.length? v.reduce((p,c)=>p+c,0)/v.length : null; }
function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function hoyISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function clase(x){ if(x==null) return 's-na'; const r=Math.round(x); return 's'+Math.min(5,Math.max(1,r)); }
function fmt(x){ return x==null? 's/d' : x.toFixed(2); }

function estadoPlazo(r){
  const lim=r.f4, resp=r.f5;
  if(resp){ return (resp<=lim)? 'A tiempo' : 'Fuera de plazo'; }
  if(!lim) return '';
  return (hoyISO()>lim)? 'Vencida' : 'En plazo';
}
function indicadores(){
  const rat=S.tables.rat, arc=S.tables.arcop, tr=S.tables.transf;
  const campos=S.schemas.rat.slice(1).map(x=>x.k);
  const comp = rat.length? promedio(rat.map(r=>campos.filter(k=>r[k]&&String(r[k]).trim()!=='').length/campos.length)) : null;
  const arcOk = arc.length? arc.filter(r=>['A tiempo','En plazo'].includes(estadoPlazo(r))).length/arc.length : null;
  const trOk  = tr.length? tr.filter(r=>r.f6&&String(r.f6).trim()!=='').length/tr.length : null;
  return {
    RAT: comp==null? null : 1+4*comp,
    ARCOP: arcOk==null? null : 1+4*arcOk,
    TRANSF: trOk==null? null : 1+4*trOk,
    arcVencidas: arc.filter(r=>estadoPlazo(r)==='Vencida').length
  };
}
// Puntaje de un control: mínimo verificado; tope 3 sin evidencia verificada
function puntajeControl(id){
  const regs=S.registros.filter(r=>r.control===id);
  const todos=regs.map(r=>num(r.puntaje)).filter(x=>x!=null);
  if(!todos.length) return {valor:null,n:regs.length,verificadas:0,alerta:false};
  const verif=regs.filter(r=>r.verificada==='Sí').map(r=>num(r.puntaje)).filter(x=>x!=null);
  let valor = verif.length? Math.min(...verif) : Math.min(3,Math.min(...todos));
  const alerta = todos.length>1 && (Math.max(...todos)-Math.min(...todos))>=2;
  return {valor, n:regs.length, verificadas:regs.filter(r=>r.verificada==='Sí').length, alerta};
}
function calcular(){
  const ind=indicadores();
  const ctrl={}; S.ctrls.forEach(c=>{ ctrl[c.id]=puntajeControl(c.id); });
  const valorRef=(ref)=> (ref in ind && typeof ind[ref]==='number') || ref==='RAT'||ref==='ARCOP'||ref==='TRANSF' ? ind[ref] : (ctrl[ref]?ctrl[ref].valor:null);
  const req={}; S.reqs.forEach(q=>{ req[q.id]= promedio(q.controles.map(valorRef)); });
  const dims=S.dims.map(d=>{
    const inc=S.reqs.filter(q=>q.dim===d.codigo && q.incluir);
    const sc=promedio(inc.map(q=>req[q.id]));
    return {...d, requisitos:S.reqs.filter(q=>q.dim===d.codigo).length, incluidos:inc.length,
            evaluados:inc.filter(q=>req[q.id]!=null).length, score:sc};
  });
  const conScore=dims.filter(d=>d.score!=null);
  const pesoT=conScore.reduce((p,d)=>p+d.peso,0);
  const total = pesoT? conScore.reduce((p,d)=>p+d.score*d.peso,0)/pesoT : null;
  return {ind, ctrl, req, dims, total,
          incluidos:S.reqs.filter(q=>q.incluir).length,
          controlesPuntuados:Object.values(ctrl).filter(c=>c.valor!=null).length};
}

/* ===== Exportar a Excel (libro con varias hojas, formato Excel 2003 XML) ===== */
function xmlEsc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/\n/g,'&#10;'); }
function celdaXML(v){
  if(v===null||v===undefined||v==='') return '<Cell><Data ss:Type="String"></Data></Cell>';
  if(typeof v==='number' && isFinite(v)) return `<Cell><Data ss:Type="Number">${v}</Data></Cell>`;
  return `<Cell><Data ss:Type="String">${xmlEsc(v)}</Data></Cell>`;
}
function hojaXML(nombre, filas){
  const rows=filas.map(r=>`<Row>${r.map(celdaXML).join('')}</Row>`).join('');
  return `<Worksheet ss:Name="${xmlEsc(nombre).slice(0,31)}"><Table>${rows}</Table></Worksheet>`;
}

/* ===== Diagnóstico de madurez y brechas ===== */
const BANDAS=[[0,2,'Crítico','#E06666'],[2,3,'Inicial','#F6B26B'],[3,4,'En desarrollo','#FFD966'],[4,4.6,'Avanzado','#93C47D'],[4.6,5.01,'Optimizado','#6AA84F']];
function metaOrg(){ return Number(S.meta.meta)||4; }
function colorNivel(x){ if(x==null) return '#c9d1de'; const b=BANDAS.find(b=>x>=b[0]&&x<b[1]); return b? b[3] : BANDAS[0][3]; }
function prioridad(g){ if(g==null) return 's/d'; if(g<=0) return 'Cumple meta'; if(g>=2) return 'Alta'; if(g>=1) return 'Media'; return 'Baja'; }
const COLOR_PRIO={'Alta':'#F8CBAD','Media':'#FFE699','Baja':'#E2EFDA','Cumple meta':'#C6E0B4','s/d':'#eef1f6'};
function pendTxt(c){
  if(['RAT','ARCOP','TRANSF'].includes(c)) return 'Indicador '+c+': '+(C.ind[c]==null?'sin datos':fmt(C.ind[c]));
  const p=C.ctrl[c]; if(!p) return c;
  if(p.n===0) return c+', sin entrevista';
  return c+', '+(p.valor==null? 'sin puntaje' : 'puntaje '+p.valor);
}
function brechasReq(){
  const m=metaOrg();
  return S.reqs.filter(q=>q.incluir && C.req[q.id]!=null && C.req[q.id]<m)
    .map(q=>({q, gap:m-C.req[q.id], pend:q.controles.filter(c=>{ if(['RAT','ARCOP','TRANSF'].includes(c)) return C.ind[c]==null || C.ind[c]<m; const p=C.ctrl[c]; return !p || p.valor==null || p.valor<m; }) }))
    .sort((a,b)=>b.gap-a.gap || a.q.id.localeCompare(b.q.id));
}
/* ===== Scoring: semáforo, fuentes normativas y cálculo explicado ===== */
function semaforo(x){
  const m=metaOrg();
  if(x==null) return {c:'#c9d1de', t:'Sin evaluar', txt:'Aún no hay evidencia suficiente para puntuar.', n:'gris'};
  if(x>=m) return {c:'#2E7D32', t:'Verde: cumple la meta', txt:'El puntaje alcanza la meta objetivo ('+m.toFixed(1)+').', n:'verde'};
  if(x>=3) return {c:'#F9A825', t:'Amarillo, en desarrollo', txt:'Entre 3,0 y la meta: hay base instalada con brechas.', n:'amarillo'};
  return {c:'#C62828', t:'Rojo, brecha crítica', txt:'Menor a 3,0: brechas significativas que requieren atención prioritaria.', n:'rojo'};
}
function fuentesReq(q){
  const s=new Set(); const ley=String(q.tipo||'').startsWith('Obligatorio');
  if(ley) s.add('Ley 21.719'); else s.add('Buena práctica');
  q.controles.forEach(c=>{
    if(['RAT','ARCOP','TRANSF'].includes(c)){ s.add('Indicador interno'); return; }
    const k=S.ctrls.find(x=>x.id===c); if(!k) return;
    if(k.id.startsWith('L21.719')) s.add('Ley 21.719');
    else s.add(k.marco==='ISO 27001:2022'?'ISO/IEC 27001:2022': k.marco==='NIST CSF 2.0'?'NIST CSF 2.0': k.marco==='CIS Controls v8.1'?'CIS v8.1': k.marco==='COBIT 5'?'COBIT 5': k.marco==='PCI DSS v4.0.1'?'PCI DSS v4.0.1':'Normativa chilena');
  });
  if(ley) s.delete('Buena práctica');
  return [...s];
}
const DESC_FUENTES={
 'Ley 21.719':'Obligación legal de la Ley 21.719 (requisitos marcados como obligatorios).',
 'ISO/IEC 27001:2022':'Controles del Anexo A de la norma ISO/IEC 27001:2022.',
 'NIST CSF 2.0':'Subcategorías del marco NIST Cybersecurity Framework 2.0.',
 'CIS v8.1':'Controles y benchmarks del CIS Controls v8.1.',
 'COBIT 5':'Procesos BAI de COBIT 5 (gestión de cambios, activos y configuración).',
 'PCI DSS v4.0.1':'Requisitos PCI DSS v4.0.1. Aplican solo si la organización procesa tarjetas.',
 'Normativa chilena':'Otras normas chilenas del alcance (Ley 21.459, 20.393, PNCS).',
 'Indicador interno':'Indicadores calculados desde el RAT, ARCOP y transferencias.',
 'Buena práctica':'Recomendación no obligatoria. No se exige por ley.'
};

async function guardarSesionV2(){
  const dims=ED.dims||[];
  if(!ED.fecha || !dims.length || !(ED.area||'').trim()){ alert('Complete la fecha, al menos una dimensión y el área del entrevistado.'); return; }
  if(!ED.id) ED.id='ENT-'+Date.now().toString(36);
  ED.dimension = dims.join(', ');
  const copia=JSON.parse(JSON.stringify(ED));
  const i=S.entrevistas.findIndex(x=>x.id===ED.id);
  if(i>=0) S.entrevistas[i]=copia; else S.entrevistas.push(copia);
  S.registros=S.registros.filter(r=>r.sesion!==ED.id);
  Object.entries(ED.controles).forEach(([c,v])=>{
    if(v && v.puntaje){
      S.registros.push({id:'REG-'+ED.id+'-'+c, sesion:ED.id, fecha:ED.fecha, dimension:ED.dimension, area:ED.area, cargo:ED.cargo||'',

}

const GKEY='ley21719_global';
let G=null, ADM=false;
function cargarG(){
  try{ const r=localStorage.getItem(GKEY); G=r? JSON.parse(r) : null; }catch(e){ G=null; }
  if(!G) G={empresas:[{id:'demo',nombre:'Organización demo',rut:'',estado:'autorizada',creada:hoyISO()}],solicitudes:[],buzon:[],admin:{correo:'',pinHash:''},activa:'demo'};
  return G;
}
async function guardarG(){ try{ localStorage.setItem(GKEY, JSON.stringify(G)); }catch(e){} }
function claveAssessment(){ return G.activa==='demo' ? 'ley21719_assessment_v1' : 'ley21719_assessment_v1_'+G.activa; }
function empresaActiva(){ return G.empresas.find(e=>e.id===G.activa); }
async function hashTxt(t){ const b=new TextEncoder().encode(t); const d=await crypto.subtle.digest('SHA-256',b); return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
function correoSimulado(para, asunto, cuerpo){
  G.buzon.push({id:'MAIL-'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), fecha:new Date().toLocaleString('es-CL'), para, asunto, cuerpo});
}
function correoAdmin(){ return G.admin.correo || '(administrador sin correo configurado)'; }
function valido(correo){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(correo||'').trim()); }
const ESTADO_EMP={autorizada:'Autorizada',pendiente:'Pendiente de autorización',revocada:'Revocada',rechazada:'Rechazada'};
const COLOR_EMP={autorizada:'#E2EFDA',pendiente:'#FFE699',revocada:'#F8CBAD',rechazada:'#F8CBAD'};

/* ----- Registro público ----- */
async function registrarSolicitud(f){
  const fd=new FormData(f); const d=Object.fromEntries(fd.entries());
  const nombre=(d.empresa||'').trim(), correo=(d.correo||'').trim();
  if(!nombre || !(d.nombre||'').trim() || !(d.cargo||'').trim() || !valido(correo) || !(d.motivo||'').trim()){ alert('Complete los campos obligatorios con un correo válido.'); return; }
  if(!d.c_aviso || !d.c_representa){ alert('Debe leer el aviso de privacidad y confirmar la representación de la empresa para continuar.'); return; }
  const rut=(d.rut||'').trim();
  if(!/^\d{1,2}\.?\d{3}\.?\d{3}-[\dkK]$/.test(rut)){ alert('Ingrese el RUT de la empresa con el formato 76.123.456-7.'); return; }
  let emp=G.empresas.find(e=>e.nombre.trim().toLowerCase()===nombre.toLowerCase());
  if(!emp){ emp={id:'emp-'+Date.now().toString(36), nombre, rut, estado:'pendiente', creada:hoyISO()}; G.empresas.push(emp); }
  const dup=G.solicitudes.find(s=>s.empresaId===emp.id && s.correo.toLowerCase()===correo.toLowerCase() && s.estado==='pendiente');
  if(dup){ alert('Ya existe una solicitud pendiente para esta empresa y correo.'); return; }
  G.solicitudes.push({id:'SOL-'+Date.now().toString(36), empresaId:emp.id, solicitante:d.nombre.trim(), cargo:(d.cargo||'').trim(), correo,
    telefono:(d.telefono||'').trim(), motivo:d.motivo.trim(), estado:'pendiente', fecha:hoyISO(), decidio:'', decidioEn:'',
    consentimiento:{aviso_version:AVISO_VERSION, aviso:true, representacion:true, comunicaciones:!!d.c_comunicaciones, registrado_en:new Date().toISOString()}});
  correoSimulado(correoAdmin(), 'Nueva solicitud de acceso: '+emp.nombre, `${d.nombre} (${correo}) solicita acceso para ${emp.nombre}. Motivo: ${d.motivo}. Revise la solicitud en Administración.`);
  correoSimulado(correo, 'Recibimos su solicitud de acceso', `Hola ${d.nombre}: recibimos su solicitud para ${emp.nombre}. Le avisaremos cuando sea resuelta.`);
  await guardarG(); render();
  alert('Solicitud enviada. Le informaremos la resolución al correo indicado.');
}
function consultarSolicitud(correo){
  const sols=G.solicitudes.filter(s=>s.correo.toLowerCase()===String(correo||'').trim().toLowerCase());
  return sols;
}
/* ----- Administración ----- */
async function configurarAdmin(f){
  const d=Object.fromEntries(new FormData(f).entries());
  if(!valido(d.correo) || (d.pin||'').length<6){ alert('Ingrese un correo válido y un PIN de al menos 6 caracteres.'); return; }
  G.admin={correo:d.correo.trim(), pinHash: await hashTxt(d.pin)};
  ADM=true; await guardarG(); render();
}
async function entrarAdmin(f){
  const d=Object.fromEntries(new FormData(f).entries());
  const h=await hashTxt(d.pin||'');
  if(h===G.admin.pinHash){ ADM=true; render(); } else { alert('PIN incorrecto.'); }
}
function salirAdmin(){ ADM=false; render(); }
async function decidirSolicitud(id, aprobar){
  const s=G.solicitudes.find(x=>x.id===id); if(!s) return;
  const emp=G.empresas.find(e=>e.id===s.empresaId);
  s.estado = aprobar? 'aprobada' : 'rechazada'; s.decidio=G.admin.correo; s.decidioEn=hoyISO();
  if(aprobar){ emp.estado='autorizada'; }
  else { const otras=G.solicitudes.some(x=>x.empresaId===emp.id && x.estado==='pendiente'); if(!otras && emp.estado==='pendiente') emp.estado='rechazada'; }
  correoSimulado(s.correo, aprobar? 'Acceso autorizado: '+emp.nombre : 'Solicitud no aprobada: '+emp.nombre,
    aprobar? `Hola ${s.solicitante}: su acceso para ${emp.nombre} fue autorizado. Ya puede ingresar desde Acceso / Ingresar.` : `Hola ${s.solicitante}: su solicitud para ${emp.nombre} no fue aprobada.`);
  await guardarG(); render();
}
async function cambiarEstadoEmpresa(id, nuevo){
  const emp=G.empresas.find(e=>e.id===id); if(!emp) return;
  if(nuevo==='revocada' && !confirm('¿Revocar el acceso de '+emp.nombre+'? Sus usuarios no podrán ingresar hasta que lo autorice de nuevo.')) return;
  emp.estado=nuevo;
  G.solicitudes.filter(s=>s.empresaId===id && s.correo).forEach(s=>{
    correoSimulado(s.correo, (nuevo==='revocada'?'Acceso revocado: ':'Acceso restablecido: ')+emp.nombre,
      nuevo==='revocada'? `Hola ${s.solicitante}: el acceso de ${emp.nombre} fue revocado por el administrador.` : `Hola ${s.solicitante}: el acceso de ${emp.nombre} fue restablecido.`);
  });
  if(G.activa===id && nuevo!=='autorizada'){ /* el acceso activo queda bloqueado por la guardia de render */ }
  await guardarG(); render();
}
async function ingresarEmpresa(id){
  const emp=G.empresas.find(e=>e.id===id);
  if(!emp || emp.estado!=='autorizada'){ alert('Esta empresa no tiene acceso autorizado.'); return; }
  G.activa=id; await guardarG(); S=await API.cargar(); if(!S.entrevistas) S.entrevistas=[];
  EXP=null; ED=null; MODO='app'; vista='inicio'; renderNav(); render();
}

function vResumen(){

  const nivelOrg = cob<0.5 ? 'Cobertura insuficiente' : nivel(total);
  const dims = C.dims.map(d=>({...d, gap: d.score==null? null : Math.max(0,m-d.score), aporte: d.score==null? null : Math.max(0,m-d.score)*d.peso, sem: semaforo(d.score)}));
  const top = dims.filter(d=>d.aporte>0).sort((a,b)=>b.aporte-a.aporte).slice(0,3);
  const brechas = brechasReq().slice(0,5);
  const sinEval = dims.filter(d=>d.evaluados < d.incluidos);
  const frase = total==null
    ? 'Todavía no hay información suficiente para calcular un puntaje. Complete el levantamiento y las entrevistas.'
    : (cob<0.5
      ? `Con la información registrada hasta hoy, el puntaje parcial es ${total.toFixed(2)} frente a una meta de ${m.toFixed(1)}. Como faltan requisitos por evaluar, aún no es un nivel de madurez definitivo.`

  const pasos = [];
  top.forEach(d=>pasos.push(`Cerrar brechas en ${d.codigo}, ${d.nombre}: puntaje ${fmt(d.score)} frente a la meta ${m.toFixed(1)}.`));

  if(!pasos.length) pasos.push('Mantener la evidencia al día y programar la próxima revisión.');
  return `<h2>Resumen ejecutivo</h2>
  <div class="resumen">
    <div class="res-top card">
      <div class="res-sem"><div class="sem-circ" style="background:${s.c}"></div>

        <div class="kpi"><div class="l">Meta${S.meta.ajustada?' (ajustada)':' (sugerida por riesgo)'}</div><div class="v">${m.toFixed(2)}</div></div>
        <div class="kpi"><div class="l">Brecha</div><div class="v">${total==null?'s/d':(total>=m?'Cumple':(m-total).toFixed(2))}</div></div>
      </div>
      <p class="res-frase">${esc(frase)}</p>
    </div>

    <div class="card"><h3>Las cinco brechas principales</h3>
      ${brechas.length? `<ol class="brechas">${brechas.map(b=>`<li><div class="br-t"><b>${esc(b.q.id)}</b>, ${esc(b.q.texto.split('. Verificar')[0])}</div>
        <div class="br-m">Puntaje ${fmt(C.req[b.q.id])}, brecha ${b.gap.toFixed(2)}, ${fuentesReq(b.q).map(f=>`<span class="fuente">${esc(f)}</span>`).join(' ')}</div></li>`).join('')}</ol>`
        : '<p class="muted">No hay brechas registradas con la información actual.</p>'}
    </div>

/* ===== Meta objetivo: fundamento explícito y perfil de riesgo ===== */
const BASE_META=4.0, TOPE_META=4.5, PASO_META=0.25;
const CRITERIOS_RIESGO=[
 {k:'sensibles', t:'Trata datos sensibles o de menores a gran escala', d:'Salud, biometría, origen, creencias, datos de menores, o volumen alto de clientes o trabajadores.'},
 {k:'automatizadas', t:'Toma decisiones automatizadas que afectan a personas', d:'Scoring, aprobaciones automáticas, precios o selección de personal por sistemas.'},
 {k:'terceros', t:'Transfiere datos fuera de Chile o usa muchos proveedores externos', d:'Nube internacional, procesadores de pago, plataformas de marketing con datos personales.'},
 {k:'vigilancia', t:'Usa videovigilancia o control biométrico', d:'Cámaras en tiendas o bodegas, huella o reconocimiento facial para control de acceso o asistencia.'}
];
function metaSugerida(criterios){
  const n=CRITERIOS_RIESGO.filter(c=>criterios && criterios[c.k]).length;
  return Math.min(TOPE_META, BASE_META + PASO_META*n);
}
async function setCriterio(k,v){
  S.meta.criterios = Object.assign({}, S.meta.criterios||{}, {[k]: !!v});
  S.meta.sugerida = metaSugerida(S.meta.criterios);
  if(!S.meta.ajustada) S.meta.meta = S.meta.sugerida;
  await persistir(); render();
}
async function ajustarMeta(valor, justificacion){
  const v=Number(valor); if(!(v>=1 && v<=5)){ alert('La meta debe estar entre 1 y 5.'); return; }
  if(Math.abs(v - (S.meta.sugerida||BASE_META))>0.001 && !(justificacion||'').trim()){ alert('Para apartarse de la meta sugerida, escriba la justificación.'); return; }
  S.meta.meta=v; S.meta.ajustada = Math.abs(v-(S.meta.sugerida||BASE_META))>0.001;
  S.meta.justificacion = S.meta.ajustada ? justificacion.trim() : '';
  await persistir(); render();
}
function bloqueMetaHTML(){
  const cr=S.meta.criterios||{};
  const sug=metaSugerida(cr);
  const m=metaOrg();
  return `<div class="card meta-card"><h3>Meta objetivo y perfil de riesgo</h3>
    <p class="muted">La meta es el puntaje que la organización quiere alcanzar en cada control y requisito. La Ley 21.719 no fija un puntaje, así que la meta es una decisión de gestión que debe quedar respaldada.</p>
    <div class="meta-base"><b>Fundamento.</b> La escala de 1 a 5 sigue la lógica de los modelos de capacidad y madurez (COBIT 5). El nivel 4 (Implementado) significa que el control opera y tiene evidencia. El nivel 5 (Optimizado) corresponde a procesos críticos con mejora continua. Por eso la base es 4,0. La meta se ajusta según el riesgo de los tratamientos, siguiendo el enfoque de ISO/IEC 27005: a mayor impacto y exposición, mayor exigencia.</div>

function fotoEvaluacion(){
  const cob = C.incluidos ? C.dims.reduce((p,d)=>p+d.evaluados,0)/C.incluidos : 0;
  const dimsFoto={}; C.dims.forEach(d=>{ dimsFoto[d.codigo]= d.score==null? null : Number(d.score.toFixed(3)); });
  return { fecha: hoyISO(), total: C.total==null? null : Number(C.total.toFixed(3)), meta: metaOrg(),
           nivel: cob<0.5 ? 'Cobertura insuficiente' : nivel(C.total), cobertura: Number(cob.toFixed(3)),
           incluidos: C.incluidos, evaluados: C.dims.reduce((p,d)=>p+d.evaluados,0), dims: dimsFoto };
}
async function registrarHistorial(){
  if(C.total==null){ alert('Todavía no hay un puntaje que registrar.'); return; }
  const f=fotoEvaluacion();
  S.historial = (S.historial||[]).filter(x=>x.fecha!==f.fecha).concat([f]).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  await persistir(); render();
}
async function borrarHistorial(fecha){
  if(!confirm('¿Eliminar el registro del historial del '+fecha+'?')) return;

}
function svgTendencia(h){
  const W=720,H=240,pl=40,pr=20,pt=20,pb=36;
  const xs=h.map((_,i)=> h.length===1? (pl+(W-pl-pr)/2) : pl+(W-pl-pr)*i/(h.length-1));
  const y=(v)=> pt+(H-pt-pb)*(1-(v-1)/4);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Evolución del puntaje">`;
  [1,2,3,4,5].forEach(v=>{ s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#e3e8f0"/><text x="${pl-8}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="#5b6575">${v}</text>`; });
  const m=metaOrg(); s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(m)}" y2="${y(m)}" stroke="#2E7D32" stroke-dasharray="6 4"/><text x="${W-pr}" y="${y(m)-6}" font-size="11" text-anchor="end" fill="#2E7D32">Meta ${m.toFixed(2)}</text>`;
  const pts=h.map((f,i)=>[xs[i], y(f.total)]);
  s+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#1F3864" stroke-width="2.5"/>`;
  h.forEach((f,i)=>{ s+=`<circle cx="${xs[i]}" cy="${y(f.total)}" r="4.5" fill="#1F3864"/><text x="${xs[i]}" y="${y(f.total)-10}" font-size="11" text-anchor="middle" fill="#1d2433">${f.total.toFixed(2)}</text><text x="${xs[i]}" y="${H-12}" font-size="10" text-anchor="middle" fill="#5b6575">${esc(f.fecha)}</text>`; });
  return s+'</svg>';
}

/* ===== Matriz de priorización: impacto (peso de la dimensión) x probabilidad (brecha) ===== */
function matrizPriorizacionHTML(){
  const m=metaOrg();
  const impactoDe = (p)=> p>=0.10 ? 'Alto' : (p>=0.06 ? 'Medio' : 'Bajo');
  const probDe = (g)=> g>=2 ? 'Alta' : (g>=1 ? 'Media' : 'Baja');
  const filas=['Alta','Media','Baja'], cols=['Bajo','Medio','Alto'];
  const celdas={}; const sinEval=[];
  C.dims.forEach(d=>{
    if(d.score==null){ sinEval.push(d); return; }
    const g=Math.max(0,m-d.score);
    const k=probDe(g)+'|'+impactoDe(d.peso);
    (celdas[k]=celdas[k]||[]).push({codigo:d.codigo, nombre:d.nombre, g});
  });
  const colorCelda=(pr,im)=>{ const a={Alta:2,Media:1,Baja:0}[pr], b={Alto:2,Medio:1,Bajo:0}[im]; const s=a+b;
    return s>=3? '#F4B6B6' : s===2? '#FBD9A6' : s===1? '#FFF0B3' : '#D7EDD0'; };
  const cuadro = filas.map(pr=>`<tr><th class="mx-f">Probabilidad ${pr.toLowerCase()}</th>${cols.map(im=>{
      const lista=(celdas[pr+'|'+im]||[]).map(x=>`<div class="mx-d"><b>${x.codigo}</b> ${esc(x.nombre)}</div>`).join('');
      return `<td class="mx-c" style="background:${colorCelda(pr,im)}">${lista||'<span class="muted">Sin dimensiones</span>'}</td>`; }).join('')}</tr>`).join('');
  return `<div class="card"><h3>Matriz de priorización</h3>
    <p class="muted">Cruza el <b>impacto</b> de cada dimensión (según su peso en el puntaje total) con la <b>probabilidad</b> de no cumplir (según su brecha frente a la meta). Las celdas de color intenso son las que conviene atender primero. Es un criterio de priorización inspirado en ISO/IEC 27005, no una medición estadística.</p>
    <div class="scroll"><table class="matriz">
      <tr><th></th><th class="mx-h">Impacto bajo</th><th class="mx-h">Impacto medio</th><th class="mx-h">Impacto alto</th></tr>
      ${cuadro}
    </table></div>
    <p class="muted" style="font-size:12px;margin-top:8px">Impacto: alto si el peso de la dimensión es 10% o más; medio si es 6% o más; bajo en otro caso. Probabilidad: alta si la brecha es 2 o más puntos; media si es de 1 o más; baja en otro caso.</p>
    ${sinEval.length? `<p class="muted"><b>Sin evaluar:</b> ${sinEval.map(d=>esc(d.codigo+' '+d.nombre)).join('; ')}.</p>` : ''}
  </div>`;
}

/* ===== Mapa de calor: dimensión x fuente y detalle por requisito ===== */
const DIM_CORTA={D1:'Gobierno',D2:'Inventario y RAT',D3:'Licitud y consentimiento',D4:'Derechos ARCOP',D5:'Principios y retención',D6:'Datos sensibles y menores',D7:'Evaluación de impacto',D8:'Seguridad de la información',D9:'Incidentes y continuidad',D10:'Proveedores y transferencias',D11:'Capacitación y phishing',D12:'Auditoría y mejora',D13:'Marcos de referencia',D14:'Seguridad física',D15:'Infraestructura y bases de datos',D16:'Gobierno de TI',D17:'Recursos humanos',D18:'Clientes y marketing'};
const FUENTE_CORTA={'Ley 21.719':'Ley 21.719','ISO/IEC 27001:2022':'ISO 27001','NIST CSF 2.0':'NIST CSF','CIS v8.1':'CIS','COBIT 5':'COBIT','PCI DSS v4.0.1':'PCI DSS','Normativa chilena':'Normativa','Indicador interno':'Indicador','Buena práctica':'Buena práctica'};
function colorPuntaje(x){
  if(x==null) return '#e6e9f0';
  const stops=[[1,[224,102,102]],[3,[255,217,102]],[5,[106,168,79]]];
  const v=Math.max(1,Math.min(5,x));
  let a=stops[0], b=stops[1];
  if(v>=3){ a=stops[1]; b=stops[2]; }
  const t=(v-a[0])/(b[0]-a[0]);
  const c=a[1].map((n,i)=>Math.round(n+(b[1][i]-n)*t));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function mapaCalorHTML(){
  const fuentesCols=Object.keys(FUENTE_CORTA);
  const incl=S.reqs.filter(q=>q.incluir);
  const celda=(dim,f)=>{
    const vals=incl.filter(q=>q.dim===dim && fuentesReq(q).includes(f) && C.req[q.id]!=null).map(q=>C.req[q.id]);
    return vals.length? promedio(vals) : null;
  };
  const cab=fuentesCols.map(f=>`<th class="hm-h" title="${esc(f)}">${esc(FUENTE_CORTA[f])}</th>`).join('');
  const filasDim=S.dims.map(d=>{
    const celdas=fuentesCols.map(f=>{ const v=celda(d.codigo,f); return `<td class="hm-c" style="background:${colorPuntaje(v)}" title="${esc(d.codigo+' · '+f+': '+(v==null?'sin evaluar':v.toFixed(2)))}">${v==null?'':v.toFixed(1)}</td>`; }).join('');
    return `<tr><th class="hm-r" title="${esc(d.codigo+' · '+d.nombre)}"><span class="hm-cod">${esc(d.codigo)}</span> ${esc(DIM_CORTA[d.codigo]||d.nombre)}</th>${celdas}</tr>`;
  }).join('');
  const detalle=S.dims.map(d=>{
    const reqs=S.reqs.filter(q=>q.dim===d.codigo && q.incluir);
    if(!reqs.length) return '';
    return `<div class="hm-fila"><div class="hm-et">${esc(d.codigo)}</div><div class="hm-tiles">${reqs.map(q=>{ const v=C.req[q.id]; return `<span class="hm-t" style="background:${colorPuntaje(v)}" title="${esc(q.id+' · '+(v==null?'sin evaluar':v.toFixed(2))+' · '+q.texto.split('. Verificar')[0])}"></span>`; }).join('')}</div></div>`;
  }).join('');
  const leyenda=`<div class="hm-leyenda"><span>1</span><span class="hm-escala"></span><span>5</span><span class="muted" style="margin-left:10px">Gris: sin evaluar</span></div>`;
  return `<div class="card"><h3>Mapa de calor</h3>
    <p class="muted">Muestra dónde la organización cumple y dónde no. Rojo indica puntaje bajo (cerca de 1), amarillo intermedio y verde alto (cerca de 5). Cada celda de la primera tabla es el promedio de los requisitos incluidos de esa dimensión que se apoyan en esa fuente.</p>
    ${leyenda}
    <div class="scroll hm-scroll"><table class="heat">
      <colgroup><col class="hm-col-r">${fuentesCols.map(()=>'<col class="hm-col-c">').join('')}</colgroup>
      <tr><th class="hm-corner">Dimensión</th>${cab}</tr>${filasDim}
    </table></div>
    <h4 style="margin:16px 0 6px">Detalle por requisito</h4>
    <p class="muted" style="font-size:12.5px">Cada cuadro es un requisito incluido. Pase el mouse para ver su código y su puntaje.</p>
    <div class="hm-detalle">${detalle}</div>
  </div>`;
}

const RET_ABIERTO={};
const VISTAS_RET=['resumen','diagnostico','dashboard'];
function hacerRetractiles(raiz){
  if(!raiz || !raiz.querySelectorAll) return;
  raiz.querySelectorAll('div.card').forEach(card=>{
    const h=card.firstElementChild;
    if(!h || h.tagName!=='H3') return;
    const clave=vista+'|'+h.textContent.trim();
    const det=document.createElement('details');
    det.className='acc';
    if(RET_ABIERTO[clave]===true) det.open=true;
    const sum=document.createElement('summary');
    sum.appendChild(h);
    const body=document.createElement('div');
    body.className='acc-b';
    while(card.firstChild) body.appendChild(card.firstChild);
    det.appendChild(sum); det.appendChild(body);
    det.addEventListener('toggle',()=>{ RET_ABIERTO[clave]=det.open; });
    card.replaceWith(det);
  });
}

/* ----- Gráficos SVG (sin librerías externas) ----- */
const COL=(x)=> x==null?'#c9d1de': x<2?'#E06666': x<3?'#F6B26B': x<4?'#FFD966': x<4.6?'#93C47D':'#6AA84F';
function svgBarH(items,{ancho=640,etiq=230}={}){
  const h=items.length*26+30, w=ancho, util=w-etiq-60;
  let s=`<svg viewBox="0 0 ${w} ${h}" width="100%" role="img">`;
  [0,1,2,3,4,5].forEach(v=>{ const x=etiq+util*v/5; s+=`<line x1="${x}" x2="${x}" y1="6" y2="${h-22}" stroke="#e3e8f0"/><text x="${x}" y="${h-6}" font-size="10" text-anchor="middle" fill="#5b6575">${v}</text>`; });
  items.forEach((it,i)=>{ const y=8+i*26; const val=it.valor==null?0:it.valor; const bw=util*val/5;
    s+=`<text x="${etiq-8}" y="${y+14}" font-size="11" text-anchor="end" fill="#1d2433">${esc(it.etiqueta)}</text>`;
    s+=`<rect x="${etiq}" y="${y+2}" width="${bw}" height="16" rx="3" fill="${COL(it.valor)}"/>`;
    s+=`<text x="${etiq+bw+6}" y="${y+14}" font-size="11" fill="#1d2433">${it.valor==null?'sin evaluar':it.valor.toFixed(2)}</text>`; });
  return s+'</svg>';
}
function svgBarV(items,{ancho=640,alto=260}={}){
  const n=items.length, pad=40, util=ancho-pad-10, paso=util/n, bw=Math.max(18,paso*0.6);
  let s=`<svg viewBox="0 0 ${ancho} ${alto+70}" width="100%" role="img">`;
  [0,1,2,3,4,5].forEach(v=>{ const y=alto-(alto-10)*v/5+10; s+=`<line x1="${pad}" x2="${ancho-10}" y1="${y}" y2="${y}" stroke="#e3e8f0"/><text x="${pad-6}" y="${y+4}" font-size="10" text-anchor="end" fill="#5b6575">${v}</text>`; });
  items.forEach((it,i)=>{ const val=it.valor==null?0:it.valor; const hh=(alto-10)*val/5; const x=pad+paso*i+(paso-bw)/2; const y=alto-hh;
    s+=`<rect x="${x}" y="${y}" width="${bw}" height="${hh}" rx="3" fill="${COL(it.valor)}"/>`;
    s+=`<text x="${x+bw/2}" y="${y-4}" font-size="10" text-anchor="middle" fill="#1d2433">${it.valor==null?'s/d':it.valor.toFixed(1)}</text>`;
    s+=`<text x="${x+bw/2}" y="${alto+16}" font-size="10" text-anchor="middle" fill="#1d2433">${esc(it.etiqueta)}</text>`; });
  return s+'</svg>';
}
function svgRadar(items,{tam=360}={}){
  const cx=tam/2, cy=tam/2, R=tam/2-50, n=items.length;
  const pt=(i,v)=>{ const a=-Math.PI/2+i*2*Math.PI/n; const r=R*v/5; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; };
  let s=`<svg viewBox="0 0 ${tam} ${tam}" width="100%" style="max-width:${tam}px" role="img">`;
  [1,2,3,4,5].forEach(v=>{ const p=items.map((_,i)=>pt(i,v).join(',')).join(' '); s+=`<polygon points="${p}" fill="none" stroke="#dde3ec"/>`; });
  items.forEach((it,i)=>{ const [x,y]=pt(i,5); s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#e3e8f0"/>`;
    const [lx,ly]=pt(i,5.9); s+=`<text x="${lx}" y="${ly+3}" font-size="9" text-anchor="middle" fill="#1d2433">${esc(it.etiqueta)}</text>`; });
  const datos=items.map((it,i)=>pt(i,it.valor==null?0:it.valor).join(',')).join(' ');
  s+=`<polygon points="${datos}" fill="rgba(31,56,100,.25)" stroke="#1F3864" stroke-width="2"/>`;
  items.forEach((it,i)=>{ if(it.valor!=null){ const [x,y]=pt(i,it.valor); s+=`<circle cx="${x}" cy="${y}" r="3" fill="#1F3864"/>`; } });
  return s+'</svg>';
}

function controlesDe(dim){
  const ids=[];
  S.reqs.filter(q=>q.dim===dim).forEach(q=>q.controles.forEach(c=>{ if(!['RAT','ARCOP','TRANSF'].includes(c) && !ids.includes(c)) ids.push(c); }));
  return ids.map(id=>S.ctrls.find(x=>x.id===id)).filter(Boolean);
}
function nuevaSesion(dim,ctrl){
  return {id:'', fecha:hoyISO(), dimension:dim||'', area:'', cargo:'', entrevistado:'', respuestas:{}, controles:{}, ctrlFoco:ctrl||''};
}
function nuevaSesionUIOld(){ ED=nuevaSesion('',''); vista='entrevistas'; renderNav(); render(); }
function nuevaEntrevistaParaOld(ctrl){
  const q=S.reqs.find(x=>x.controles.includes(ctrl));
  ED=nuevaSesion(q?q.dim:'',ctrl); vista='entrevistas'; renderNav(); render();
}
function abrirSesionOld(id){ ED=JSON.parse(JSON.stringify(S.entrevistas.find(x=>x.id===id))); renderNav(); render(); }
function cerrarEditor(){ ED=null; render(); }
function edCampo(k,v){ ED[k]=v; }
function edDim(v){ ED.dimension=v; render(); }
function edResp(i,campo,v){ const k=ED.dimension+'|'+i; ED.respuestas[k]=Object.assign(ED.respuestas[k]||{},{[campo]:v}); }
function edCtl(c,campo,v){ ED.controles[c]=Object.assign(ED.controles[c]||{},{[campo]:v}); }
async function guardarSesionOld(){
  if(!ED.fecha || !ED.dimension || !(ED.area||'').trim()){ alert('Complete la fecha, la dimensión y el área del entrevistado.'); return; }
  if(!ED.id) ED.id='ENT-'+Date.now().toString(36);
  const copia=JSON.parse(JSON.stringify(ED));
  const i=S.entrevistas.findIndex(x=>x.id===ED.id);
  if(i>=0) S.entrevistas[i]=copia; else S.entrevistas.push(copia);
  S.registros=S.registros.filter(r=>r.sesion!==ED.id);
  Object.entries(ED.controles).forEach(([c,v])=>{
    if(v && v.puntaje){
      S.registros.push({id:'REG-'+ED.id+'-'+c, sesion:ED.id, fecha:ED.fecha, dimension:ED.dimension, area:ED.area, cargo:ED.cargo||'',
        control:c, afirma:v.afirma||'', evidencia:v.evidencia||'', verificada:v.verificada||'No', puntaje:v.puntaje, obs:v.obs||''});
    }
  });
  await persistir(); ED=null; render();
  alert('Entrevista guardada. Los puntajes de los controles ya se actualizaron.');
}
async function eliminarSesion(id){
  if(!confirm('¿Eliminar esta entrevista y sus puntajes?')) return;
  S.entrevistas=S.entrevistas.filter(x=>x.id!==id); S.registros=S.registros.filter(r=>r.sesion!==id);
  await persistir(); render();
}
async function borrarRegistro(id){ if(!confirm('¿Eliminar este registro?')) return; S.registros=S.registros.filter(r=>r.id!==id); await persistir(); render(); }

const PREF={rat:'RAT-',arcop:'ARC-'};
function siguienteId(tabla){
  const p=PREF[tabla]; if(!p) return '';
  const usados=S.tables[tabla].map(r=>String(r.f0||'')).filter(x=>x.startsWith(p)).map(x=>parseInt(x.slice(p.length),10)).filter(n=>!isNaN(n));
  const n=(usados.length?Math.max(...usados):0)+1;
  return p+String(n).padStart(3,'0');
}
function kf(tabla,pal){ const c=S.schemas[tabla].find(x=>x.label.toLowerCase().includes(pal.toLowerCase())); return c?c.k:null; }
function sumarDias(iso,n){ if(!iso) return ''; const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
async function agregarFila(){
  const r={}; S.schemas[tablaActiva].forEach(c=>r[c.k]='');
  if(PREF[tablaActiva]) r.f0=siguienteId(tablaActiva);
  if(tablaActiva==='arcop'){ const rc=kf('arcop','Recepción'), li=kf('arcop','Límite'), es=kf('arcop','Estado'); if(rc) r[rc]=hoyISO(); if(li) r[li]=sumarDias(hoyISO(),30); if(es) r[es]='Pendiente'; }
  if(tablaActiva==='rat'){ const u=kf('rat','Última'); if(u) r[u]=hoyISO(); }
  S.tables[tablaActiva].push(r); EXP=S.tables[tablaActiva].length-1; await persistir(); render();
}

const AREA_TEMAS={
 "Gerencia general":["Gobierno y auditoría","Legal y cumplimiento"],
 "RRHH":["Personas (RRHH)","Seguridad física","Accesos y contraseñas"],
 "Comercial / Ventas":["Clientes y ventas","Marketing","Pagos y finanzas"],
 "Marketing":["Marketing","Comunicaciones","Clientes y ventas"],
 "Finanzas":["Pagos y finanzas","Compras y proveedores"],
 "Compras":["Compras y proveedores","Pagos y finanzas"],
 "Operaciones / Logística / Tiendas":["Operaciones y logística","Seguridad física","Clientes y ventas"],
 "Tecnología (TI)":["Tecnología","Accesos y contraseñas","Almacenamiento y respaldo"],
 "Legal / Cumplimiento":["Legal y cumplimiento","Gobierno y auditoría"],
 "Otra":[]
};
const SINONIMOS={"cámara":"videovigilancia cctv video","camara":"videovigilancia cctv video","cctv":"videovigilancia","contraseña":"clave credencial acceso","clave":"contraseña credencial","huella":"biométrico biometria","rostro":"biométrico facial","boleta":"factura facturación tributario sii","factura":"boleta facturación sii","sii":"facturación tributaria","correo":"email mail boletín","email":"correo","sueldo":"remuneración nómina","nomina":"remuneración","nómina":"remuneración","finiquito":"desvinculación","licencia":"licencia médica salud","tarjeta":"pago tarjeta","pago":"medios de pago","despacho":"logística envío","envio":"logística despacho","backup":"respaldo","respaldo":"backup","vpn":"acceso remoto","cookies":"cookie analítica","llamada":"call center grabación","reclamo":"garantía devolución","denuncia":"canal de denuncias"};
function expandir(q){ const parts=q.split(/\s+/).filter(Boolean); return parts.map(p=>[p].concat((SINONIMOS[p]||'').split(' ')).join(' ')).join(' '); }

let DD={row:null,q:'',idx:0};
function listaDD(){
  const q=DD.q.trim().toLowerCase();
  if(!q){
    const temas=AREA_TEMAS[S.meta.area]||[];
    const sug=S.catRat.filter(x=>temas.includes(x.tema));
    const rec=(S.recientes||[]).map(n=>S.catRat.find(x=>x.actividad===n)).filter(Boolean);
    const vistos=new Set(); const out=[];
    rec.concat(sug).forEach(x=>{ if(!vistos.has(x.actividad)){ vistos.add(x.actividad); out.push({x, tag: rec.includes(x)?'Reciente':(temas.length?'Sugerida para su área':'')}); } });
    return {items: out.slice(0,10), titulo: temas.length? 'Sugeridas para '+S.meta.area+' y recientes' : 'Recientes (indique el área en Inicio para ver sugerencias)'};
  }
  const terms=expandir(q).toLowerCase().split(/\s+/).filter(Boolean);
  const hits=S.catRat.filter(x=>{ const txt=[x.actividad,x.finalidad,x.categorias,x.titulares,x.tema].join(' ').toLowerCase(); return terms.some(w=>txt.includes(w)) && q.split(/\s+/).every(w=>txt.includes(w) || (SINONIMOS[w]||'').split(' ').some(s=>txt.includes(s))); });
  hits.sort((a,b)=>(b.actividad.toLowerCase().startsWith(q)-a.actividad.toLowerCase().startsWith(q)) || a.actividad.localeCompare(b.actividad));
  return {items: hits.slice(0,12).map(x=>({x,tag:x.tema})), titulo: hits.length? hits.length+' coincidencias' : 'Sin coincidencias. Pruebe con otra palabra.'};
}
function pintarDD(){
  if(DD.row===null) return;
  const box=document.getElementById('ddg'); if(!box) return;
  const L=listaDD();
  DD.items=L.items;
  if(DD.idx>=L.items.length) DD.idx=0;
  box.innerHTML = `<div class="ddh">${esc(L.titulo)}</div>` + (L.items.length? L.items.map((o,k)=>`
    <div class="opt ${k===DD.idx?'act':''}" data-k="${k}">
      <b>${esc(o.x.actividad)}</b> ${o.x.sensibles==='Sí'?'<span class="tag warnt">sensible</span>':''}
      <small>${esc(o.tag||'')}${o.tag?', ':''}${esc(o.x.finalidad)}</small>
    </div>`).join('') : '<div class="ddh">Escriba para buscar</div>');
  const r=(DD.anchor && DD.anchor.getBoundingClientRect) ? DD.anchor.getBoundingClientRect() : {left:20,top:120,bottom:140,width:300};
  const alto=Math.min(340, window.innerHeight*0.6);
  box.style.left=Math.max(8,Math.min(r.left, window.innerWidth-460))+'px';
  box.style.width=Math.max(440,r.width)+'px';
  box.style.top = (r.bottom+alto+6 > window.innerHeight) ? Math.max(8,r.top-alto-4)+'px' : (r.bottom+3)+'px';
  box.style.display='block';
}
document.getElementById('ddg').addEventListener('click',e=>{
  const o=e.target.closest('.opt'); if(!o) return;
  const it=(DD.items||[])[+o.dataset.k]; if(it) elegirDD(it.x.actividad);
});
function abrirDD(i,el){ DD={row:i,q:'',idx:0,anchor:el,items:[]}; pintarDD(); }
function buscarDD(i,v){ DD=Object.assign(DD,{row:i,q:v,idx:0}); pintarDD(); }
function cerrarDD(){ const box=document.getElementById('ddg'); if(box) box.style.display='none'; DD.row=null; }
function teclaDD(e,i){
  if(DD.row!==i) return;
  const n=(DD.items||[]).length;
  if(e.key==='ArrowDown'){ e.preventDefault(); DD.idx=Math.min(n-1,DD.idx+1); pintarDD(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); DD.idx=Math.max(0,DD.idx-1); pintarDD(); }
  else if(e.key==='Enter'){ e.preventDefault(); const it=(DD.items||[])[DD.idx]; if(it) elegirDD(it.x.actividad); }
  else if(e.key==='Escape' || e.key==='Tab'){ cerrarDD(); }
}
window.addEventListener('scroll',()=>{ if(DD.row!==null) pintarDD(); },true);
window.addEventListener('resize',()=>{ if(DD.row!==null) pintarDD(); });

async function elegirDD(nombre){
  const i=DD.row; cerrarDD(); if(i===null) return;
  S.recientes=[nombre].concat((S.recientes||[]).filter(n=>n!==nombre)).slice(0,5);
  await aplicarActividad(i,nombre);
}
document.addEventListener('mousedown',e=>{ if(DD.row!==null && !e.target.closest('.wrapRel') && !e.target.closest('#ddg')) cerrarDD(); });

/* Sistema sugerido por tema (se completa solo y se puede cambiar) */
const SISTEMA_TEMA={
 "Personas (RRHH)":"Sistema de RRHH / nómina",
 "Clientes y ventas":"CRM / ERP corporativo",
 "Marketing":"Plataforma de email marketing / CRM",
 "Pagos y finanzas":"ERP / sistema de facturación",
 "Compras y proveedores":"ERP / sistema de proveedores",
 "Operaciones y logística":"Sistema de bodega / despacho",
 "Seguridad física":"Sistema de control de acceso y CCTV",
 "Accesos y contraseñas":"Directorio de identidades (IAM)",
 "Almacenamiento y respaldo":"Servidores de archivos / nube",
 "Tecnología":"Sistema de tickets / monitoreo",
 "Legal y cumplimiento":"Registro de cumplimiento (planilla o sistema)",
 "Comunicaciones":"Correo corporativo / intranet",
 "Gobierno y auditoría":"Planilla de auditoría"
};
/* Llena los campos de una fila RAT desde el catálogo.
   sobre=true reemplaza valores; sobre=false solo completa los vacíos. */
function llenarRat(r, it, sch, sobre, area){
  const kfx=(pal)=>{ const c=sch.find(x=>x.label.toLowerCase().includes(pal.toLowerCase())); return c?c.k:null; };
  const campos=[
    ['Finalidad', it.finalidad], ['Base Legal (', it.base], ['Categorías de Datos', it.categorias],
    ['Datos Sensibles', it.sensibles], ['Categorías de Titulares', it.titulares], ['Destinatarios', it.destinatarios],
    ['Transferencia', it.transferencia], ['País', it.pais || 'No aplica'], ['Plazo', it.plazo], ['Medidas', it.medidas],
    ['Fuente de los datos', (['Personas (RRHH)','Clientes y ventas','Marketing'].includes(it.tema)?'Directamente del titular':'Sistema interno')],
    ['Cómo se recolectan', 'Por el canal habitual del proceso (validar)'],
    ['Ubicación del almacenamiento', it.transferencia==='Sí' ? 'Chile y fuera de Chile' : 'Chile'],
    ['Forma de eliminación', 'Borrado seguro y registro de la eliminación'],
    ['Encargados', 'Proveedores definidos en el contrato (validar)'],
    ['Decisiones automatizadas', 'No'],
    ['Nivel de riesgo', it.sensibles==='Sí' ? 'Alto' : (it.transferencia==='Sí' ? 'Medio' : 'Bajo')],
    ['Requiere evaluación de impacto', it.sensibles==='Sí' ? 'Sí' : (it.transferencia==='Sí' ? 'Por evaluar' : 'No')],
    ['Derechos ARCOP', 'Acceso, rectificación, supresión, oposición y portabilidad'],
    ['Estado de la actividad', 'Vigente'],
    ['Base Legal Conservación', it.base], ['Sistema', SISTEMA_TEMA[it.tema]||''] ];
  campos.forEach(([pal,v])=>{ const k=kfx(pal); if(k && v!==undefined && (sobre || r[k]===''||r[k]==null)) r[k]=v; });
  const kr=kfx('Responsable'); if(kr && area && (sobre || !r[kr])) r[kr]=area;
  const ku=kfx('Última'); if(ku && (sobre || !r[ku])) r[ku]=hoyISO();
  return r;
}

async function aplicarActividad(i,val){
  const r=S.tables.rat[i]; const ka=kf('rat','Actividad'); if(ka) r[ka]=val;
  const it=S.catRat.find(x=>x.actividad===val);
  if(it){ llenarRat(r,it,S.schemas.rat,true,S.meta.area); }
  const u=kf('rat','Última'); if(u) r[u]=hoyISO();
  await persistir(); render();
}
async function editarCelda(i,k,v){
  const t=S.tables[tablaActiva]; t[i][k]=v;
  if(tablaActiva==='rat'){ const u=kf('rat','Última'); if(u) t[i][u]=hoyISO(); }
  if(tablaActiva==='arcop' && k===kf('arcop','Recepción')){ const l=kf('arcop','Límite'); if(l) t[i][l]=sumarDias(v,30); }
  if(tablaActiva==='transf' && k==='f0'){
    const rr=S.tables.rat.find(x=>x.f0===v);
    if(rr){ const cp=(tp,rp)=>{ const a=kf('transf',tp), b=kf('rat',rp); if(a&&b) t[i][a]=rr[b]||''; };
      cp('Destinatario','Destinatarios'); cp('Categoría','Categorías de Datos'); cp('Finalidad','Finalidad'); cp('País','País'); }
  }
  await persistir(); render();
}

async function borrarFila(i){ if(!confirm('¿Quitar esta fila?')) return; S.tables[tablaActiva].splice(i,1); await persistir(); render(); }

/* ----- Ayuda ----- */
function vAyuda(){ return vAyudaBase()+vAyudaExtra(); }
function vAyudaExtra(){
  return `<div class="card"><h3>Cómo llenar (hoja del Excel)</h3><div class="scroll"><table><tr><th>Paso</th><th>Hoja</th><th>Qué hacer</th><th>Valores aceptados</th><th>Ejemplo</th></tr>${S.comoLlenar.map(p=>`<tr><td>${esc(p.paso)}</td><td>${esc(p.hoja)}</td><td class="wrapc">${esc(p.que)}</td><td class="wrapc">${esc(p.valores)}</td><td class="wrapc">${esc(p.ejemplo)}</td></tr>`).join('')}</table></div></div>
  <div class="card"><h3>Escala de puntaje</h3><table><tr><th>Puntaje</th><th>Nivel</th><th>Criterio</th></tr>${S.escala.map(e=>`<tr><td class="num"><span class="score s${e.puntaje}">${e.puntaje}</span></td><td>${esc(e.nivel)}</td><td class="wrapc">${esc(e.criterio)}</td></tr>`).join('')}</table><p class="muted">Niveles de madurez: Crítico (1.0 a 1.9), Inicial (2.0 a 2.9), En desarrollo (3.0 a 3.9), Avanzado (4.0 a 4.5), Optimizado (4.6 a 5.0).</p></div>
  <div class="card"><h3>Notas de uso y verificación</h3><ol>${S.notas.slice(1).map(n=>`<li>${esc(String(n).replace(/^[0-9]+\.\s*/,''))}</li>`).join('')}</ol></div>`;
}
function vAyudaBase(){

  return `<h2>Cómo usar y método</h2>
  <div class="card"><h3>Orden recomendado</h3>
  <ol>
   <li><b>Inicio:</b> complete los datos de la evaluación y acepte el disclaimer.</li>
   <li><b>Levantamiento:</b> registre actividades (RAT), solicitudes ARCOP y transferencias internacionales. Estos datos alimentan indicadores automáticos.</li>
   <li><b>Requisitos Ley:</b> revise qué requisitos están incluidos. Los obligatorios de la ley vienen marcados; los extras (marcos y buenas prácticas) vienen desmarcados.</li>
   <li><b>Registro de entrevistas:</b> registre una fila por entrevista y por control, con evidencia verificada o no.</li>
   <li><b>Dashboard:</b> revise el resultado. Si aparece "Cobertura insuficiente", faltan requisitos por evaluar.</li>
  </ol></div>
  <div class="card"><h3>Cómo se calcula el puntaje</h3>
  <p><b>Control.</b> Es el <b>mínimo</b> de los puntajes propuestos con evidencia verificada. Si no hay evidencia verificada, el máximo es 3 (Definido).</p>
  <p><b>Por qué el mínimo.</b> Un control vale lo que vale su punto más débil. El promedio oculta brechas y premia a quien responde mejor. Es también el criterio con que un regulador o auditor evaluaría: la organización debe demostrar el control, no solo declararlo.</p>
  <p><b>Discrepancia.</b> Si dos puntajes del mismo control difieren en 2 o más, aparece la alerta. Validar con el dueño del proceso antes de cerrar el control.</p>
  <p><b>Requisito.</b> Es el promedio de sus controles e indicadores. <b>Dimensión.</b> Es el promedio de los requisitos incluidos. <b>Total.</b> Es el promedio de las dimensiones ponderado por su peso.</p>
  <p><b>Límite.</b> El mínimo puede ser severo si una entrevista está mal informada. Por eso la alerta exige validación.</p></div>
  <div class="card"><h3>Almacenamiento de la información</h3>
  <p>La información se guarda en el equipo desde el que se trabaja. Use <b>Exportar datos</b> para respaldarla y <b>Importar datos</b> para cargar un respaldo.</p></div>`;
}

/* ----- Exportar / importar / reiniciar ----- */
function exportar(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='assessment_ley21719_'+hoyISO()+'.json'; a.click();
}
function importar(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json';
  inp.onchange=async()=>{ let datos; try{ datos=JSON.parse(await inp.files[0].text()); }catch(e){ alert('Archivo no válido: no es un JSON.'); return; } if(!datos || typeof datos!=='object' || (!datos.tables && !datos.registros && !datos.entrevistas && !datos.meta)){ alert('Archivo no válido: no contiene datos del assessment.'); return; } try{ S=migrar(datos); if(!S.entrevistas) S.entrevistas=[]; if(!S.historial) S.historial=[]; await persistir(); render(); alert('Datos importados.'); }catch(e){ console.error(e); alert('No se pudieron importar los datos: '+e.message); } };
  inp.click();
}
async function reiniciar(){ if(!confirm('Esto borra los datos guardados en este navegador. ¿Continuar?')) return; try{localStorage.removeItem(claveAssessment());}catch(e){} S=JSON.parse(JSON.stringify(SEED)); S.registros=[]; S.entrevistas=[]; await persistir(); render(); }

init();
